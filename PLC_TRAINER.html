$("#bar").addEventListener("click",e=>{const f=e.target.dataset.f;if(!f)return;if(f=="br")branch();else if(f=="ap")branch(1);else if(f=="de")del();else if(f=="ar")addRung();else if(f=="ib"){ib=!ib;bar()}else if(f[0]=="c")addC(f.slice(1));else addO(f.slice(1))});
function txt(){document.documentElement.lang=lang=="bn"?"bn":"en";$("#ti").textContent=tr("ti");$("#run").textContent=running&&!paused?tr("stop"):tr("run");$("#rst").textContent=tr("rst");$("#h1").textContent=tr("i");$("#h2").textContent=tr("q");$("#h3").textContent=tr("m");$("#xp").textContent=tr("xp");$("#nv").textContent="\u2190 "+tr("bk");$("#p2").textContent=tr("p2")+" \u2192";$("#im").textContent=tr("im");$("#lg").textContent=lang=="en"?"বাংলা":"English";$("#traceTitle").textContent=tr("trace");
const x=$("#ex");x.innerHTML=`<option value="">${tr("ex")}…</option>`+[1,2,3].map(i=>`<option value="${i}">${tr("e"+i)}</option>`).join("");chl();bar();side();insp();draw();upd()}
const EX={1:[{c:[{par:[[mk("NO","I0")],[mk("NO","Q0")]]},mk("NC","I1")],o:[mk("OTE","Q0")]}],
2:[{c:[mk("NO","I0")],o:[mk("TON","T0",3000)]},{c:[mk("NO","T0")],o:[mk("OTE","Q0")]},{c:[mk("NC","T0")],o:[mk("OTE","Q1")]}],
3:[{c:[mk("P","I0")],o:[mk("CTU","C0",3)]},{c:[mk("NO","C0")],o:[mk("OTE","Q0")]},{c:[mk("NO","I1")],o:[mk("RES","C0")]}]};
function load(r,t){P={rungs:JSON.parse(JSON.stringify(r)),tags:t||{}};sel=null;inputs={};send({cmd:"load",p:P.rungs});commit();insp()}
$("#ex").onchange=e=>{if(e.target.value)load(EX[e.target.value]);e.target.value=""};
$("#pf").onchange=e=>{prof=e.target.value;commit();txt()};
$("#lg").onclick=()=>{lang=lang=="en"?"bn":"en";txt();commit()};
$("#run").onclick=()=>{hist=[];if(running&&!paused){running=false;send({cmd:"stop"})}else{running=true;paused=false;send({cmd:"run"});for(const a in inputs)send({cmd:"in",a,v:inputs[a]})}txt()};
$("#stp").onclick=()=>{send({cmd:"pause"});running=true;paused=true;for(const a in inputs)send({cmd:"in",a,v:inputs[a]});send({cmd:"step",dt:100});txt()};
$("#rst").onclick=()=>{hist=[];inputs={};send({cmd:"reset"});if(running&&!paused)send({cmd:"run"});live={b:{},t:{},d:{...dv}};draw();side();upd()};
$("#xp").onclick=()=>{$("#js").value=JSON.stringify({v:1,profile:prof,io:addrs().map(a=>({addr:a,tag:rawTag(a)})),rungs:P.rungs,tags:P.tags})};
const validAddr=a=>typeof a=="string"&&/^[IQMTCD](?:[0-9]|[1-5][0-9]|6[0-3])$/.test(a);
function validateProgram(d){if(!d||!Array.isArray(d.rungs)||d.rungs.length>500)throw Error("Expected up to 500 rungs.");if(d.profile&&!Object.prototype.hasOwnProperty.call(PF,d.profile))throw Error("Unknown PLC profile.");let count=0;
const checkContacts=(s,depth)=>{if(!Array.isArray(s)||depth>16)throw Error("Invalid or deeply nested contacts.");for(const n of s){if(++count>5000||!n||typeof n!="object")throw Error("Program is too large.");if(n.par){if(!Array.isArray(n.par)||!n.par.length)throw Error("Invalid branch.");n.par.forEach(p=>checkContacts(p,depth+1))}else if(!CT.includes(n.t)||!validAddr(n.a)||((CM.includes(n.t))&&!Number.isFinite(n.pt)))throw Error("Invalid contact.");}};
for(const r of d.rungs){if(!r||typeof r!="object"||!Array.isArray(r.c)||!Array.isArray(r.o))throw Error("Invalid rung.");checkContacts(r.c,0);for(const o of r.o){if(++count>5000||!o||!OT.includes(o.t)||!validAddr(o.a)||o.pt!=null&&!Number.isFinite(o.pt))throw Error("Invalid output.");if(!addressTypes(o,true).includes(o.a[0]))throw Error(o.t+" cannot write "+o.a+".");if(["TON","TOF","TP","TONR","CTU","CTD"].includes(o.t)&&!(o.pt>0))throw Error(o.t+" preset must be greater than zero.");if((o.t=="MOV"||o.t=="ADD")&&o.src!=null&&(typeof o.src!="string"||(o.src[0]=="#"?(!o.src.slice(1)||!Number.isFinite(Number(o.src.slice(1)))):!validAddr(o.src))))throw Error("Invalid source operand.");}}
if(d.tags!=null&&(typeof d.tags!="object"||Array.isArray(d.tags)||Object.entries(d.tags).some(([a,t])=>!validAddr(a)||typeof t!="string"||t.length>10)))throw Error("Invalid tags.");return d}
$("#im").onclick=()=>{try{const d=validateProgram(JSON.parse($("#js").value));if(d.profile){prof=d.profile;$("#pf").value=prof}load(d.rungs,d.tags);txt()}catch(e){$("#js").value=String(e.message||"Invalid JSON")}};
try{const s=JSON.parse(localStorage.getItem("llab"));if(s&&s.P&&s.P.rungs){P=s.P;prof=PF[s.prof]?s.prof:prof;lang=s.lang||lang}}catch(e){}
if(!P.rungs.length)P={rungs:JSON.parse(JSON.stringify(EX[1]))};
try{const m=location.hash.match(/p=(.+)/);if(m){const s=JSON.parse(decodeURIComponent(escape(atob(m[1]))));P=s.P;prof=s.prof}}catch(e){}
$("#pf").value=prof;snap();send({cmd:"load",p:P.rungs});txt();traceView();
function encodeProgramTransfer(value){const bytes=new TextEncoder().encode(JSON.stringify(value));let binary="";for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
(()=>{try{const l=document.getElementById("p2");if(!l)return;l.href="Wiring.html?p1="+encodeURIComponent(location.href.split(/[?#]/)[0])+"&load=part1";l.addEventListener("click",event=>{event.preventDefault();const encoded=encodeProgramTransfer({profile:prof,rungs:P.rungs,tags:P.tags||{}});if(encoded.length>1500000){alert("This ladder is too large to transfer in one step. Save it from Part 1 and load the saved program in Part 2.");return}const destination=new URL(l.href,location.href);destination.hash="program="+encoded;location.href=destination.href})}catch(e){console.error("Could not prepare the Part 2 program transfer.",e)}})();
$("#testLink").addEventListener("click",event=>{event.preventDefault();const payload={profile:prof,rungs:P.rungs,tags:P.tags||{}};const encoded=encodeProgramTransfer(payload);if(encoded.length>1500000){alert("This ladder is too large for a direct handoff. Use the Part 1 Export button, then open the saved program file on the test page.");return}const destination=new URL(event.currentTarget.href,location.href);destination.hash="program="+encoded;location.href=destination.href});
</script></body></html>
