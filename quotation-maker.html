<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quotation / Invoice Maker | ElectraLab</title>
<style>
:root{color-scheme:light;--ink:#1f2937;--mut:#6b7280;--line:#d1d5db;--bg:#eef0f3;--pn:#fff;--pn2:#f9fafb;--inp:#fff;--ui:#0369a1;--onui:#fff;--ac:#1e3a8a}
[data-theme=dark]{color-scheme:dark;--ink:#e5e7eb;--mut:#9ca3af;--line:#2b3547;--bg:#0b1220;--pn:#111a2b;--pn2:#17213a;--inp:#0f1727;--ui:#38bdf8;--onui:#06222f}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:grid;grid-template-columns:500px 1fr;height:calc(100vh - 88px)}.panel{overflow:auto;background:var(--pn);border-right:1px solid var(--line)}
.bar{position:sticky;top:0;z-index:2;background:var(--pn);border-bottom:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}.bar .full{grid-column:1/-1;display:flex;gap:8px;flex-direction:row}
.body{padding:14px 16px 40px}.card{border:1px solid var(--line);border-radius:6px;margin-bottom:14px}.card>h3{margin:0;padding:9px 12px;font-size:14px;background:var(--pn2);border-bottom:1px solid var(--line);border-radius:6px 6px 0 0}.in{padding:10px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .w{grid-column:1/-1}
.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}input,select,textarea,button{font:inherit;color:var(--ink)}input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--inp)}textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ui);outline-offset:1px}button{padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--inp);cursor:pointer}button:hover{background:var(--pn2)}.pri{background:var(--ui);color:var(--onui);border-color:var(--ui);flex:1}.pri:hover{background:var(--ui);filter:brightness(1.12)}
.en{border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px;background:var(--pn2)}.tools{display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px}.tools button{padding:2px 8px}.add{width:100%;border-style:dashed}.hint{font-size:12px;color:var(--mut);margin:6px 0 0}.badge{font-size:12px;color:var(--mut)}.ok{color:#15803d}.warn{color:#b45309}.danger{color:#b91c1c}
.preview{overflow:auto;padding:16px;height:calc(100vh - 88px)}#page{background:#fff;width:210mm;min-height:297mm;margin:0 auto;padding:20mm 14mm 14mm 20mm;box-shadow:0 2px 12px #0003;color:#111;line-height:1.35}
#page header{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px;border-bottom:1px solid #d1d5db;padding-bottom:10px}.logo{width:30mm;height:20mm;object-fit:contain;object-position:left top}.hd{flex:1}#page h1{margin:0;font-size:2em;line-height:1.1}#page .ct{margin-top:4px;font-size:.9em;color:#374151}#page a{color:inherit;text-decoration:underline;text-decoration-color:#9ca3af;text-underline-offset:2px}
.meta{display:grid;grid-template-columns:1fr auto;gap:14px;margin:10px 0 14px}.box{border:1px solid #d1d5db;padding:7px;break-inside:avoid}.box b{display:block;margin-bottom:2px}.docinfo{text-align:right}.docinfo b{font-size:1.05em}.table{width:100%;border-collapse:collapse;table-layout:fixed}.table th,.table td{border:1px solid #bfc4cc;padding:5px;vertical-align:top;overflow-wrap:anywhere}.table th{background:#f3f4f6;text-align:left}.table .num{text-align:right;white-space:nowrap}.table tr{break-inside:avoid;page-break-inside:avoid}.totals{margin:10px 0 0 auto;width:75%;break-inside:avoid}.totals div{display:flex;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding:3px 0}.totals .grand{font-size:1.08em;font-weight:700;border-top:2px solid #111;border-bottom:0;padding-top:6px}.words,.notes,.signs{margin-top:12px;break-inside:avoid}.words{border:1px solid #d1d5db;padding:7px}.notes h2,.signs h2{font-size:.95em;text-transform:uppercase;letter-spacing:.06em;margin:0 0 5px;padding-bottom:2px;border-bottom:1px solid #111}.notes p{margin:3px 0;white-space:pre-line}.signs{display:grid;grid-template-columns:1fr 1fr;gap:35mm;padding-top:12mm}.signline{border-top:1px solid #555;padding-top:4px;min-height:20mm}.stamp{min-height:20mm}
.t-modern h1,.t-modern h2{color:var(--ac)}.t-modern header{border-bottom:2px solid var(--ac)}.t-modern .table th{background:#eef6fb}.t-compact{padding:20mm 12mm 12mm 20mm!important}.t-compact .table th,.t-compact .table td{padding:3px}.t-compact .meta{margin-bottom:8px}.t-compact .box{padding:5px}.t-exec header{border-bottom:3px double #111}.t-exec h1{text-transform:uppercase;letter-spacing:.1em;font-size:1.8em}.t-exec .table th{background:#fff;border-bottom:2px solid #111}.t-minimal h1{font-weight:300;font-size:2.3em}.t-minimal header{border:0}.t-minimal .table th{background:#fff;border-left:0;border-right:0}.t-minimal .table td{border-left:0;border-right:0}.t-banner header{background:var(--ac);color:#fff;padding:10px 14px}.t-banner .ct{color:#e5e7eb}.t-banner .table th{background:#eef2ff}
.top{min-height:56px;display:flex;align-items:center;gap:14px;padding:6px 16px;background:var(--pn);border-bottom:1px solid var(--line)}.top .back{display:inline-block;padding:6px 14px;border:1px solid var(--ui);border-radius:4px;color:var(--ui);background:var(--inp);text-decoration:none;font-weight:600;white-space:nowrap}.top .back:hover{background:var(--ui);color:var(--onui)}.ttl{flex:1;display:flex;flex-direction:column;line-height:1.25}.ttl b{font-size:17px}.tg{font-size:12px;color:var(--mut)}.foot{min-height:32px;display:flex;align-items:center;justify-content:center;padding:4px 16px;background:var(--pn);border-top:1px solid var(--line);color:var(--mut);font-size:11.5px;text-align:center}
.tabs{display:none}@media(max-width:900px){.app{display:block;height:auto}.panel{overflow:visible;border:0}.preview{height:auto}.bar{top:41px}.tabs{display:flex;position:sticky;top:0;z-index:3;background:var(--pn);border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;border-radius:0;padding:10px}.tabs .on{border-bottom:2px solid var(--ui);font-weight:600}body.pvmode .panel{display:none}body:not(.pvmode) .preview{display:none}}@media(max-width:600px){.tg{display:none}.top{flex-wrap:wrap}.grid{grid-template-columns:1fr}.table-scroll{overflow:auto}.itemgrid{grid-template-columns:1fr 1fr}}
.pt{width:100%;border-collapse:collapse;table-layout:fixed}.pt>thead>tr>td,.pt>tbody>tr>td,.pt>tfoot>tr>td{padding:0;border:0}.pt>thead>tr>td,.pt>tfoot>tr>td{height:0}
@media print{body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.top,.foot,.tabs{display:none!important}.app{display:block;height:auto}.panel{display:none}.preview{padding:0;overflow:visible;height:auto}#page{box-shadow:none;width:auto;min-height:0;padding:0 14mm 0 20mm!important;zoom:1!important}#page.t-compact{padding:0 12mm 0 20mm!important}.pt>thead>tr>td{height:20mm}.pt>tfoot>tr>td{height:14mm}.t-compact .pt>tfoot>tr>td{height:12mm}@page{size:A4;margin:0}.table tr,.box,.totals,.words,.notes,.signs,header{break-inside:avoid;page-break-inside:avoid}}
.switch{display:flex;gap:4px}.switch button{flex:1}.switch .on{background:var(--ui);color:var(--onui);border-color:var(--ui)}.quick{display:flex;gap:6px;flex-wrap:wrap}.quick button{font-size:12px}
@media(min-width:901px){.app{grid-template-columns:clamp(400px,36vw,500px) 1fr;height:calc(100vh - 88px);height:calc(100dvh - 88px)}.preview{height:calc(100vh - 88px);height:calc(100dvh - 88px)}}
@media(max-width:900px){.bar{position:static;grid-template-columns:repeat(4,1fr)}.body{max-width:760px;margin:0 auto;padding:12px 14px 60px}.tabs button{min-height:44px;font-size:15px}.preview{padding:8px}}
@media(max-width:600px){.bar{grid-template-columns:1fr 1fr}.body{padding:10px 10px 60px}.in{padding:8px}.en .grid{grid-template-columns:1fr 1fr}.en .grid .w{grid-column:1/-1}.tools{flex-wrap:wrap}.tools button{flex:1;min-height:38px}.top{gap:8px;padding:6px 10px}.top .back{padding:6px 10px;font-size:13px}.ttl b{font-size:15px}.foot{font-size:11px;padding:6px 10px}input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{font-size:16px}}
@media(pointer:coarse){button,select,input[type=text],input[type=date],input[type=number],input[type=email]{min-height:40px}}
</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('electralab-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script></head>
<body>
<div class="top"><a class="back" href="Docs.html">← Back to DOCBOX</a><div class="ttl"><b>ElectraLab Docs</b><span class="tg">Quotation / Invoice Maker: electrical contractor documents, ready for A4 print</span></div><button id="theme" type="button">Dark mode</button></div>
<div class="tabs"><button class="on" id="tE">Edit</button><button id="tP">Preview</button></div>
<div class="app"><div class="panel"><div class="bar">
<div class="full switch"><button id="quoteBtn" class="on">Quotation</button><button id="invoiceBtn">Invoice</button></div>
<label>Template<select id="tpl"><option value="classic">Classic</option><option value="modern">Modern</option><option value="compact">Compact</option><option value="exec">Executive</option><option value="minimal">Minimal</option><option value="banner">Banner</option></select></label>
<label>Font<select id="font"><option>Arial</option><option>Calibri</option><option>Times New Roman</option><option>Georgia</option></select></label>
<label>Font size<select id="fs"><option>8.5</option><option>9</option><option selected>9.5</option><option>10</option><option>10.5</option><option>11</option></select></label>
<label>Accent color<input type="color" id="ac" value="#1e3a8a"></label>
<div class="full"><button class="pri" id="print">Print / Save as PDF (A4)</button></div>
<div class="full"><button id="save">Save JSON</button><button id="load">Load JSON</button><button id="reset">Reset</button><input type="file" id="loadf" accept=".json" hidden></div>
<div class="full badge" id="pgs"></div>
</div><div class="body" id="form"></div></div><div class="preview" id="pv"><div id="page"></div></div></div>
<footer class="foot">Free, safe and private: no sign-up, no tracking, no data stored on any server. Everything you type stays in your browser and never leaves your device.</footer>
<script>
const $=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMoney=(n,c)=>new Intl.NumberFormat(c==='BDT'?'en-BD':c==='INR'?'en-IN':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number.isFinite(n)?n:0);
const sym=c=>({BDT:'৳',USD:'$',EUR:'€',INR:'₹',GBP:'£',AED:'د.إ',SAR:'﷼'})[c]||c;
const curCode=c=>c;
const today=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
const addDays=(date,n)=>{const d=new Date((date||today())+'T00:00:00');d.setDate(d.getDate()+n);const z=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
const def=()=>({type:'quotation',company:{},client:{},doc:{number:'QTN-001',date:today(),validity:addDays(today(),15),due:addDays(today(),15)},currency:'BDT',tax:5,shipping:0,items:[],notes:'',terms:'',bank:'',signature:'',stamp:'',logo:'',o:{tpl:'classic',font:'Arial',fs:'9.5',ac:'#1e3a8a'}});
let D=def();
function cleanNum(v){const n=parseFloat(v);return Number.isFinite(n)?n:0}
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
function lineParts(x){const g=r2(Math.max(0,cleanNum(x.qty))*Math.max(0,cleanNum(x.price))),d=r2(g*Math.min(100,Math.max(0,cleanNum(x.discount)))/100);return {g,d,t:r2(g-d)}}
function itemTotal(x){return lineParts(x).t}
function totals(){const L=D.items.map(lineParts),gross=r2(L.reduce((a,x)=>a+x.g,0)),disc=r2(L.reduce((a,x)=>a+x.d,0)),sub=r2(L.reduce((a,x)=>a+x.t,0)),ship=r2(Math.max(0,cleanNum(D.shipping))),taxRate=Math.max(0,cleanNum(D.tax)),tax=r2((sub+ship)*taxRate/100),total=r2(sub+ship+tax);return {gross,disc,sub,ship,taxRate,tax,total}}
const wordsBelow20=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function under1000(n){let s='';if(n>=100){s+=wordsBelow20[Math.floor(n/100)]+' hundred';n%=100;if(n)s+=' ';}if(n>=20){s+=tens[Math.floor(n/10)];n%=10;if(n)s+='-'+wordsBelow20[n]}else if(n)s+=wordsBelow20[n];return s||'zero'}
function integerWords(n){n=Math.floor(Math.abs(n));if(n<1000)return under1000(n);const units=[[1e9,'billion'],[1e6,'million'],[1e3,'thousand']];let out=[];for(const [v,name] of units){if(n>=v){out.push(under1000(Math.floor(n/v))+' '+name);n%=v}}if(n)out.push(under1000(n));return out.join(' ')}
function integerWordsIN(n){n=Math.floor(Math.abs(n));if(!n)return'zero';let o=[];for(const[v,nm]of[[1e7,'crore'],[1e5,'lakh'],[1e3,'thousand']]){if(n>=v){const q=Math.floor(n/v);o.push((q>=1000?integerWordsIN(q):under1000(q))+' '+nm);n%=v}}if(n)o.push(under1000(n));return o.join(' ')}
function amountWords(n,c){const cents=Math.round(Math.abs(n)*100),whole=Math.floor(cents/100),minor=cents%100,W=(c==='BDT'||c==='INR')?integerWordsIN:integerWords,names={BDT:['taka','paisa'],USD:['dollar','cent'],EUR:['euro','cent'],INR:['rupee','paise'],GBP:['pound','pence'],AED:['dirham','fils'],SAR:['riyal','halala']}[c]||[c.toLowerCase(),'minor'],pl=(w,k)=>k===1||['taka','paisa','paise','pence','fils','halala','minor'].includes(w)?w:w+'s';return `${W(whole)} ${pl(names[0],whole)}${minor?` and ${W(minor)} ${pl(names[1],minor)}`:''}`.replace(/^./,m=>m.toUpperCase())+' only'}
const linkify=t=>{const LK=/([\w.+-]+@[\w-]+(?:\.[\w-]+)+)|((?:https?:\/\/|www\.)[^\s<]+|\b(?:[a-z0-9-]+\.)+(?:com|org|net|io|dev|me|co|app|edu|info|bd|uk|us|ca)\b(?:\/[^\s<]*)?)/gi;return e(t).replace(LK,(m,em)=>{const x=m.replace(/[.,;:!?)]+$/,''),r=m.slice(x.length),href=em?'mailto:'+x:(/^https?:/i.test(x)?x:'https://'+x);return `<a href="${href}" target="_blank" rel="noopener">${x}</a>${r}`})};
function fld(k,label,v,type='text',wide=false){let input=type==='textarea'?`<textarea data-k="${k}">${e(v)}</textarea>`:`<input type="${type}" data-k="${k}" value="${e(v)}">`;return `<label class="f${wide?' w':''}">${label}${input}</label>`}
function section(title,body){return `<div class=card><h3>${title}</h3><div class=in>${body}</div></div>`}
function form(){
 const C=D.company,P=D.client,Q=D.doc;
 let h=section('Company details',`<div class=grid>${fld('company.name','Company name',C.name)}${fld('company.phone','Phone',C.phone)}${fld('company.email','Email',C.email,'email')}${fld('company.website','Website',C.website)}${fld('company.tax','Tax / VAT number',C.tax)}${fld('company.address','Address',C.address,'textarea',true)}</div><label class=f style="margin-top:8px">Logo (optional)<input type=file id=logo accept="image/*"></label>${D.logo?'<button data-a=rmLogo style="margin-top:6px">Remove logo</button>':''}`);
 h+=section('Client details',`<div class=grid>${fld('client.name','Client name',P.name)}${fld('client.phone','Phone',P.phone)}${fld('client.email','Email',P.email,'email')}${fld('client.address','Address',P.address,'textarea',true)}</div>`);
 h+=section('Document details',`<div class=grid>${fld('doc.number','Document number',Q.number)}${fld('doc.date','Date',Q.date,'date')}${fld('doc.validity','Validity date',Q.validity,'date')}${fld('doc.due','Due date',Q.due,'date')}<label class=f>Currency<select data-k=currency>${['BDT','USD','EUR','INR','GBP','AED','SAR'].map(x=>`<option ${D.currency===x?'selected':''}>${x}</option>`).join('')}</select></label>${fld('tax','Tax / VAT %',D.tax,'number')}${fld('shipping','Shipping / other charges',D.shipping,'number')}</div><p class=hint>${D.type==='quotation'?'Validity date is shown on the quotation.':'Due date is shown on the invoice.'}</p>`);
 h+=section('Line items',`<div class=badge style="margin-bottom:8px">Quick add:</div><div class=quick><button data-q=MCB>MCB / breaker</button><button data-q=CABLE>Cable</button><button data-q=PANEL>Panel board</button><button data-q=LIGHT>LED lighting</button><button data-q=EARTH>Earthing work</button><button data-q=LABOR>Electrical labor</button></div><div style="margin-top:10px">${D.items.map((x,i)=>`<div class=en><div class=tools><button data-a=up data-i=${i}>↑</button><button data-a=dn data-i=${i}>↓</button><button data-a=dup data-i=${i}>Duplicate</button><button data-a=del data-i=${i}>Remove</button></div><div class=grid>${fld(`items.${i}.desc`,'Description',x.desc,'textarea',true)}${fld(`items.${i}.unit`,'Unit',x.unit)}${fld(`items.${i}.qty`,'Quantity',x.qty,'number')}${fld(`items.${i}.price`,'Unit price',x.price,'number')}${fld(`items.${i}.discount`,'Discount %',x.discount,'number')}<label class=f>Total<input value="${fmtMoney(itemTotal(x),D.currency)}" readonly></label></div></div>`).join('')}</div><button class=add data-a=add>+ Add line item</button>`);
 h+=section('Notes, payment and terms',`<div class=grid>${fld('notes','Notes',D.notes,'textarea',true)}${fld('bank','Bank details',D.bank,'textarea',true)}${fld('terms','Payment terms',D.terms,'textarea',true)}${fld('stamp','Stamp / authorization text',D.stamp,'text')}${fld('signature','Signature name',D.signature,'text',true)}</div>`);
 h+=`<div class=card><h3>Document check</h3><div class=in id=check></div></div>`;$('form').innerHTML=h;
}
function draw(){
 const pg=$('page'),C=D.company,P=D.client,Q=D.doc,T=totals(),currency=D.currency, title=D.type==='quotation'?'QUOTATION':'INVOICE';
 pg.className='t-'+D.o.tpl;pg.style.fontFamily=`"${D.o.font}",${D.o.font==='Calibri'?'Carlito,Arial,':''}${D.o.font==='Times New Roman'||D.o.font==='Georgia'?'serif':'sans-serif'}`;pg.style.fontSize=D.o.fs+'pt';pg.style.setProperty('--ac',D.o.ac);document.documentElement.style.setProperty('--ac',D.o.ac);
 let h=`<header>${D.logo?`<img class=logo src="${D.logo}" alt="">`:''}<div class=hd><h1>${title}</h1><div><b>${e(C.name)||''}</b></div><div class=ct>${[C.address&&linkify(C.address).replace(/\n/g,'<br>'),C.phone&&e(C.phone),C.email&&`<a href="mailto:${e(C.email)}">${e(C.email)}</a>`,C.website&&linkify(C.website),C.tax&&('Tax/VAT: '+e(C.tax))].filter(Boolean).join(' &nbsp;|&nbsp; ')}</div></div></header>`;
 h+=`<div class=meta><div class=box>${P.name?`<b>Bill to / Client</b>${e(P.name)}<br>`:''}${P.address?e(P.address).replace(/\n/g,'<br>'):''}${P.phone?`<br>${e(P.phone)}`:''}${P.email?`<br><a href="mailto:${e(P.email)}">${e(P.email)}</a>`:''}</div><div class="box docinfo"><b>${title}</b><div>No. ${e(Q.number)}</div><div>Date: ${e(Q.date)}</div><div>${D.type==='quotation'?'Valid until:':'Due date:'} ${e(D.type==='quotation'?Q.validity:Q.due)}</div></div></div>`;
 const rows=D.items.filter(x=>x.desc||cleanNum(x.qty)||cleanNum(x.price)).map((x,i)=>`<tr><td>${i+1}</td><td>${linkify(x.desc).replace(/\n/g,'<br>')}</td><td>${e(x.unit)}</td><td class=num>${fmtMoney(cleanNum(x.qty),currency)}</td><td class=num>${sym(currency)} ${fmtMoney(cleanNum(x.price),currency)}</td><td class=num>${cleanNum(x.discount).toFixed(2)}%</td><td class=num>${sym(currency)} ${fmtMoney(itemTotal(x),currency)}</td></tr>`).join('');
 h+=`<table class=table><thead><tr><th style="width:5%">#</th><th style="width:34%">Description</th><th style="width:9%">Unit</th><th style="width:10%">Qty</th><th style="width:14%">Unit price</th><th style="width:10%">Disc.</th><th style="width:18%">Line total</th></tr></thead><tbody>${rows||'<tr><td colspan=7>No line items</td></tr>'}</tbody></table>`;
 h+=`<div class=totals><div><span>Subtotal</span><span>${sym(currency)} ${fmtMoney(T.sub,currency)}</span></div><div><span>Shipping / other</span><span>${sym(currency)} ${fmtMoney(T.ship,currency)}</span></div><div><span>Tax / VAT (${T.taxRate.toFixed(2)}%)</span><span>${sym(currency)} ${fmtMoney(T.tax,currency)}</span></div><div class=grand><span>Grand total</span><span>${sym(currency)} ${fmtMoney(T.total,currency)}</span></div></div>`;
 h+=`<div class=words><b>Amount in words:</b> ${e(amountWords(T.total,currency))}</div>`;
 if(D.notes||D.bank||D.terms)h+=`<div class=notes>${D.notes?`<h2>Notes</h2><p>${linkify(D.notes)}</p>`:''}${D.bank?`<h2>Bank details</h2><p>${linkify(D.bank)}</p>`:''}${D.terms?`<h2>Payment terms / Terms & conditions</h2><p>${linkify(D.terms)}</p>`:''}</div>`;
 h+=`<div class=signs><div class=signline>${D.signature?`<b>${e(D.signature)}</b><br>`:''}Authorized signature</div><div class="signline stamp">${D.stamp?e(D.stamp):'Stamp / seal'}</div></div>`;
 pg.innerHTML=`<table class=pt><thead><tr><td></td></tr></thead><tbody><tr><td>${h}</td></tr></tbody><tfoot><tr><td></td></tr></tfoot></table>`;fit();check();
}
function fit(){const w=$('pv').clientWidth-32;if(w<=0)return;const pg=$('page'),mm=96/25.4;pg.style.zoom=1;const h=pg.offsetHeight;pg.style.zoom=Math.min(1,w/(210*mm));const bot=D.o.tpl==='compact'?12:14,pages=Math.max(1,Math.ceil((h-(20+bot)*mm)/((277-bot)*mm)-.02));$('pgs').innerHTML=pages===1?'<span class=ok>✓ Fits on 1 A4 page</span>':`<span class=warn>${pages} pages. Try Compact or a smaller font.</span>`}
function check(){const T=totals();let h=`<div class=badge>${D.items.filter(x=>x.desc||cleanNum(x.qty)||cleanNum(x.price)).length} line item(s) · Grand total <b>${sym(D.currency)} ${fmtMoney(T.total,D.currency)}</b></div>`;if(!D.company.name)h+=`<div class=danger style="margin-top:5px">Add the company name.</div>`;if(!D.client.name)h+=`<div class=badge style="margin-top:5px">Client name is optional, but recommended.</div>`;if(D.type==='quotation'&&!D.doc.validity)h+=`<div class=badge style="margin-top:5px">Validity date is empty.</div>`;if(D.type==='invoice'&&!D.doc.due)h+=`<div class=badge style="margin-top:5px">Due date is empty.</div>`;$('check').innerHTML=h}
function setPath(path,val){const a=path.split('.');if(a[0]==='company'||a[0]==='client'||a[0]==='doc'){D[a[0]][a[1]]=val}else if(a[0]==='items'){D.items[+a[1]][a[2]]=val}else D[a[0]]=val}
$('form').addEventListener('input',ev=>{const t=ev.target;if(t.dataset.k)setPath(t.dataset.k,t.value);draw()});
$('form').addEventListener('change',ev=>{const t=ev.target;if(t.id==='logo'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=700,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.logo=c.toDataURL('image/png');form();draw()};im.src=r.result};r.readAsDataURL(f)}});
const presets={MCB:{desc:'MCB / miniature circuit breaker',unit:'pcs',qty:1,price:0,discount:0},CABLE:{desc:'Electrical cable',unit:'m',qty:1,price:0,discount:0},PANEL:{desc:'Electrical distribution panel board',unit:'pcs',qty:1,price:0,discount:0},LIGHT:{desc:'LED lighting fixture',unit:'pcs',qty:1,price:0,discount:0},EARTH:{desc:'Earthing installation work',unit:'job',qty:1,price:0,discount:0},LABOR:{desc:'Electrical installation labor',unit:'day',qty:1,price:0,discount:0}};
$('form').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.q){D.items.push({...presets[b.dataset.q]});form();draw();return}
 const a=b.dataset.a,i=+b.dataset.i;if(a==='add')D.items.push({desc:'',unit:'pcs',qty:1,price:0,discount:0});else if(a==='del')D.items.splice(i,1);else if(a==='dup')D.items.splice(i+1,0,{...D.items[i]});else if(a==='up'&&i>0)[D.items[i-1],D.items[i]]=[D.items[i],D.items[i-1]];else if(a==='dn'&&i<D.items.length-1)[D.items[i+1],D.items[i]]=[D.items[i],D.items[i+1]];else if(a==='rmLogo')D.logo='';else return;form();draw()});
function typeSet(type){D.type=type;const p=type==='quotation'?'QTN-':'INV-';if(!D.doc.number||/^(QTN|INV)-\d+$/i.test(D.doc.number))D.doc.number=p+((String(D.doc.number).match(/\d+$/)||['001'])[0]);if(type==='quotation'&&!D.doc.validity)D.doc.validity=addDays(D.doc.date,15);if(type==='invoice'&&!D.doc.due)D.doc.due=addDays(D.doc.date,15);$('quoteBtn').className=type==='quotation'?'on':'';$('invoiceBtn').className=type==='invoice'?'on':'';document.title=type==='quotation'?'Quotation Maker | ElectraLab':'Invoice Maker | ElectraLab';form();draw()}
$('quoteBtn').onclick=()=>typeSet('quotation');$('invoiceBtn').onclick=()=>typeSet('invoice');
[['tpl','tpl'],['font','font'],['fs','fs'],['ac','ac']].forEach(([id,k])=>{$(id).value=D.o[k];$(id).addEventListener('input',()=>{D.o[k]=$(id).value;draw()})});
$('print').onclick=()=>{const t=document.title;document.title=(D.doc.number||'document')+' - '+(D.type==='quotation'?'Quotation':'Invoice');const was=document.body.classList.contains('pvmode');document.body.classList.add('pvmode');addEventListener('afterprint',()=>{document.title=t;document.body.classList.toggle('pvmode',was)},{once:true});window.print()};
$('save').onclick=()=>{const a=document.createElement('a'),blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download=(D.doc.number||'document')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('load').onclick=()=>$('loadf').click();$('loadf').onchange=ev=>{const f=ev.target.files[0];if(!f)return;f.text().then(t=>{try{const x=JSON.parse(t),base=def();D={...base,...x,company:{...base.company,...(x.company||{})},client:{...base.client,...(x.client||{})},doc:{...base.doc,...(x.doc||{})},o:{...base.o,...(x.o||{})},items:Array.isArray(x.items)?x.items:[]};refresh()}catch(_){alert('This file is not a valid quotation/invoice data file.')}});ev.target.value=''};
$('reset').onclick=()=>{if(confirm('Clear all entries and start over?')){D=def();refresh()}};
const tab=p=>{document.body.classList.toggle('pvmode',p);$('tE').className=p?'':'on';$('tP').className=p?'on':'';fit();scrollTo(0,0)};$('tE').onclick=()=>tab(false);$('tP').onclick=()=>tab(true);
const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('electralab-theme',t)}catch(_){}$('theme').textContent=t==='dark'?'Light mode':'Dark mode'};$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(document.documentElement.dataset.theme||'light');
function refresh(){['tpl','font','fs','ac'].forEach(k=>$(k).value=D.o[k]);$('quoteBtn').className=D.type==='quotation'?'on':'';$('invoiceBtn').className=D.type==='invoice'?'on':'';form();draw()}addEventListener('resize',fit);refresh();
</script></body></html>
