
name: Minify and Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Minifier Tool
        run: npm install -g html-minifier-terser

      - name: Minify all HTML files
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Minifying: $file"

            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --minify-js true \
              --minify-css true \
              "$file" -o "$file"

          done < <(
            find . \
              -type f \
              -name "*.html" \
              -not -path "./node_modules/*" \
              -not -path "./.git/*" \
              -print0
          )

      - name: Commit minified HTML to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . \
            -type f \
            -name "*.html" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -print0 | xargs -0 -r git add -- 

          if ! git diff --cached --quiet; then
            git commit -m "chore: minify HTML files [skip ci]"
            git push origin HEAD:main
          else
            echo "No HTML changes to commit."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
