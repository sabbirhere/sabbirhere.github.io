name: Minify and Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Change to 'master' if your main branch is master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Minifier Tool
        run: npm install -g html-minifier-terser

      - name: Minify all files automatically
        run: |
          find . -name "*.html" -not -path "./node_modules/*" -not -path "./.git/*" | while read file; do
            html-minifier-terser --collapse-whitespace --remove-comments --minify-js true --minify-css true "$file" -o "$file"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
