<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maintenance Log | ElectraLab</title>
<style>
:root{color-scheme:light;--ink:#1f2937;--mut:#6b7280;--line:#d1d5db;--bg:#eef0f3;--pn:#fff;--pn2:#f9fafb;--inp:#fff;--ui:#0369a1;--onui:#fff;--ac:#1e3a8a}

*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:grid;grid-template-columns:500px 1fr;height:calc(100vh - 88px)}.panel{overflow:auto;background:var(--pn);border-right:1px solid var(--line)}
.bar{position:sticky;top:0;z-index:2;background:var(--pn);border-bottom:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}.bar .full{grid-column:1/-1;display:flex;gap:8px}
.body{padding:14px 16px 40px}.card{border:1px solid var(--line);border-radius:6px;margin-bottom:14px}.card>h3{margin:0;padding:9px 12px;font-size:14px;background:var(--pn2);border-bottom:1px solid var(--line);border-radius:6px 6px 0 0}.in{padding:10px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .w{grid-column:1/-1}
.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}input,select,textarea,button{font:inherit;color:var(--ink)}input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--inp)}textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ui);outline-offset:1px}button{padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--inp);cursor:pointer}button:hover{background:var(--pn2)}.pri{background:var(--ui);color:var(--onui);border-color:var(--ui);flex:1}.pri:hover{background:var(--ui);filter:brightness(1.12)}
.en{border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px;background:var(--pn2)}.tools{display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px}.tools button{padding:2px 8px}.add{width:100%;border-style:dashed}.hint{font-size:12px;color:var(--mut);margin:6px 0 0}.badge{font-size:12px;color:var(--mut)}.ok{color:#15803d}.warn{color:#b45309}.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.quick button{font-size:12px}.switch{display:flex;gap:4px;flex-wrap:wrap}.switch button{flex:1}.switch .on{background:var(--ui);color:var(--onui);border-color:var(--ui)}details summary{cursor:pointer;font-size:12px;color:var(--mut)}
.preview{overflow:auto;padding:16px;height:calc(100vh - 88px)}#page{background:#fff;width:210mm;min-height:297mm;margin:0 auto;padding:20mm 14mm 14mm 20mm;box-shadow:0 2px 12px #0003;color:#111;line-height:1.35}
#page header{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px;border-bottom:1px solid #d1d5db;padding-bottom:8px}.logo{width:30mm;height:20mm;object-fit:contain;object-position:left top}.hd{flex:1}#page h1{margin:0;font-size:1.7em;line-height:1.1}#page a{color:inherit;text-decoration:underline}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;margin:8px 0 12px;padding:7px;border:1px solid #d1d5db;break-inside:avoid}.sh{font-size:1.02em;font-weight:700;margin:12px 0 4px;break-after:avoid}
.table{width:100%;border-collapse:collapse;table-layout:fixed}.table th,.table td{border:1px solid #bfc4cc;padding:4px 5px;vertical-align:top;overflow-wrap:anywhere}.table th{background:#f3f4f6;text-align:left}.table .num{text-align:right}.table .c{text-align:center}.table tr{break-inside:avoid;page-break-inside:avoid}
.pass{color:#15803d;font-weight:700}.fail{color:#b91c1c;font-weight:700;text-decoration:underline}.sumbox,.words{border:1px solid #d1d5db;padding:7px;margin-top:10px;break-inside:avoid}.notes p{margin:3px 0}
.totals{margin:10px 0 0 auto;width:70%;break-inside:avoid}.totals div{display:flex;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding:3px 0}.totals .grand{font-weight:700;border-top:2px solid #111;border-bottom:0;padding-top:6px}
.signs{display:grid;gap:12mm;margin-top:12px;padding-top:14mm;break-inside:avoid}.signline{border-top:1px solid #555;padding-top:4px;min-height:14mm}
.t-modern h1,.t-modern .sh{color:var(--ac)}.t-modern header{border-bottom:2px solid var(--ac)}.t-modern .table th{background:#eef2ff}.t-compact{padding:20mm 12mm 12mm 20mm!important}.t-compact .table th,.t-compact .table td{padding:2px 3px}.t-minimal h1{font-weight:300;font-size:2.1em}.t-minimal header{border:0}.t-minimal .table th{background:#fff}.t-minimal .table td,.t-minimal .table th{border-left:0;border-right:0}
.top{min-height:56px;display:flex;align-items:center;gap:14px;padding:6px 16px;background:var(--pn);border-bottom:1px solid var(--line)}.top .back{display:inline-block;padding:6px 14px;border:1px solid var(--ui);border-radius:4px;color:var(--ui);background:var(--inp);text-decoration:none;font-weight:600;white-space:nowrap}.top .back:hover{background:var(--ui);color:var(--onui)}.ttl{flex:1;display:flex;flex-direction:column;line-height:1.25}.ttl b{font-size:17px}.tg{font-size:12px;color:var(--mut)}.foot{min-height:32px;display:flex;align-items:center;justify-content:center;padding:4px 16px;background:var(--pn);border-top:1px solid var(--line);color:var(--mut);font-size:11.5px;text-align:center}
.tabs{display:none}@media(max-width:900px){.app{display:block;height:auto}.panel{overflow:visible;border:0}.preview{height:auto}.tabs{display:flex;position:sticky;top:0;z-index:3;background:var(--pn);border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;border-radius:0;padding:10px}.tabs .on{border-bottom:2px solid var(--ui);font-weight:600}body.pvmode .panel{display:none}body:not(.pvmode) .preview{display:none}}
.pt{width:100%;border-collapse:collapse;table-layout:fixed}.pt>thead>tr>td,.pt>tbody>tr>td,.pt>tfoot>tr>td{padding:0;border:0}.pt>thead>tr>td,.pt>tfoot>tr>td{height:0}
@media print{body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.top,.foot,.tabs{display:none!important}.app{display:block;height:auto}.panel{display:none}.preview{padding:0;overflow:visible;height:auto}#page{box-shadow:none;width:auto;min-height:0;padding:0 14mm 0 20mm!important;zoom:1!important}#page.t-compact{padding:0 12mm 0 20mm!important}.pt>thead>tr>td{height:20mm}.pt>tfoot>tr>td{height:14mm}.t-compact .pt>tfoot>tr>td{height:12mm}@page{size:A4;margin:0}}
@media(min-width:901px){.app{grid-template-columns:clamp(400px,36vw,500px) 1fr;height:calc(100vh - 88px);height:calc(100dvh - 88px)}.preview{height:calc(100vh - 88px);height:calc(100dvh - 88px)}}
@media(max-width:900px){.bar{position:static;grid-template-columns:repeat(4,1fr)}.body{max-width:760px;margin:0 auto;padding:12px 14px 60px}.tabs button{min-height:44px;font-size:15px}.preview{padding:8px}}
@media(max-width:600px){.bar{grid-template-columns:1fr 1fr}.body{padding:10px 10px 60px}.in{padding:8px}.grid{grid-template-columns:1fr}.en .grid{grid-template-columns:1fr 1fr}.en .grid .w{grid-column:1/-1}.tools{flex-wrap:wrap}.tools button{flex:1;min-height:38px}.top{gap:8px;padding:6px 10px;flex-wrap:wrap}.tg{display:none}.top .back{padding:6px 10px;font-size:13px}.ttl b{font-size:15px}.foot{font-size:11px;padding:6px 10px}input[type=text],input[type=date],input[type=number],select,textarea{font-size:16px}}
@media(pointer:coarse){button,select,input[type=text],input[type=date],input[type=number]{min-height:40px}}
</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('electralab-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script></head>
<body>
<div class="top"><a class="back" href="Docs.html">← Back to DOCBOX</a><div class="ttl"><b>ElectraLab Docs</b><span class="tg">Maintenance Log: jobs, hours and next-due schedule, ready for A4 print</span></div><button id="theme" type="button">Dark mode</button></div>
<div class="tabs"><button class="on" id="tE">Edit</button><button id="tP">Preview</button></div>
<div class="app"><div class="panel"><div class="bar">
<label>Template<select id="tpl"><option value="classic">Classic</option><option value="modern">Modern</option><option value="compact">Compact</option><option value="minimal">Minimal</option></select></label>
<label>Font<select id="font"><option>Arial</option><option>Calibri</option><option>Times New Roman</option><option>Georgia</option></select></label>
<label>Font size<select id="fs"><option>8.5</option><option>9</option><option>9.5</option><option>10</option><option>10.5</option><option>11</option></select></label>
<label>Accent color<input type="color" id="ac" value="#1e3a8a"></label>
<div class="full"><button class="pri" id="print">Print / Save as PDF (A4)</button></div>
<div class="full"><button id="save">Save JSON</button><button id="load">Load JSON</button><button id="reset">Reset</button><input type="file" id="loadf" accept=".json" hidden></div>
<div class="full badge" id="pgs"></div>
</div><div class="body" id="form"></div></div><div class="preview" id="pv"><div id="page"></div></div></div>
<footer class="foot">Free, safe and private: no sign-up, no tracking, no data stored on any server. Everything you type stays in your browser and never leaves your device.</footer>
<script>
const $=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:0},r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const z2=n=>String(n).padStart(2,'0'),dstr=d=>`${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`,today=()=>dstr(new Date());
const LK=/([\w.+-]+@[\w-]+(?:\.[\w-]+)+)|((?:https?:\/\/|www\.)[^\s<]+)/gi;
const linkify=t=>e(t).replace(LK,(m,em)=>{const x=m.replace(/[.,;:!?)]+$/,''),r=m.slice(x.length),h=em?'mailto:'+x:(/^https?:/i.test(x)?x:'https://'+x);return `<a href="${h}" target="_blank" rel="noopener">${x}</a>${r}`}).replace(/\n/g,'<br>');
const fld=(k,l,v,t='text',w=false)=>`<label class="f${w?' w':''}">${l}${t==='textarea'?`<textarea data-k="${k}">${e(v)}</textarea>`:`<input type="${t}" data-k="${k}" value="${e(v)}">`}</label>`;
const sel=(k,l,v,o,w=false)=>`<label class="f${w?' w':''}">${l}<select data-k="${k}">${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return `<option value="${e(a)}"${a==v?' selected':''}>${e(b)}</option>`}).join('')}</select></label>`;
const card=(t,b)=>`<div class="card"><h3>${t}</h3><div class="in">${b}</div></div>`;
const tl=(px,d)=>`<div class="tools">${[['up','↑'],['dn','↓'],['dup','Duplicate'],['del','Remove']].map(([a,t])=>`<button data-a="${px}${a}" ${d}>${t}</button>`).join('')}</div>`;
function mv(A,a,i){if(a==='del')A.splice(i,1);else if(a==='dup')A.splice(i+1,0,JSON.parse(JSON.stringify(A[i])));else if(a==='up'&&i>0)[A[i-1],A[i]]=[A[i],A[i-1]];else if(a==='dn'&&i<A.length-1)[A[i+1],A[i]]=[A[i],A[i+1]]}
const hdr=(t,s)=>`<header>${D.logo?`<img class="logo" src="${D.logo}" alt="">`:''}<div class="hd"><h1>${t}</h1>${s?`<div>${s}</div>`:''}</div></header>`;
const meta=p=>{p=p.filter(x=>x[1]);return p.length?`<div class="meta">${p.map(x=>`<div><b>${x[0]}</b> ${e(x[1])}</div>`).join('')}</div>`:''};
const sg=(l,n)=>`${n?`<b>${e(n)}</b><br>`:''}${l}`,sigs=a=>`<div class="signs" style="grid-template-columns:repeat(${a.length},1fr)">${a.map(x=>`<div class="signline">${x}</div>`).join('')}</div>`;
const OP={tpl:'classic',font:'Arial',fs:'9.5',ac:'#1e3a8a'};
const mg=(b,x)=>{if(typeof b!=='object'||b===null||Array.isArray(b))return x===undefined?b:x;const o={...b};if(x&&typeof x==='object')for(const k in x)o[k]=k in b?mg(b[k],x[k]):x[k];return o};
const TY=['Preventive','Corrective','Breakdown','Inspection'],SS=['Done','Pending','Follow-up'];
const PM=[['Panel inspection','Inspection','HT/LT panel visual and thermal inspection, terminal tightness check'],['Transformer oil check','Preventive','Transformer oil level, leakage, silica gel and temperature check'],['Earth pit check','Preventive','Earth pit resistance measurement and water filling'],['Motor insulation test','Preventive','Motor insulation resistance test and terminal inspection'],['Capacitor bank check','Preventive','Capacitor bank current, fuse and contactor check'],['Generator service','Preventive','Generator service: oil, filters, coolant, battery and load test']];
const nR=()=>({date:today(),tag:'',type:'Preventive',desc:'',parts:'',hrs:'',tech:'',status:'Done',rem:''}),nS=()=>({eq:'',last:'',int:'',unit:'months'});
const nxt=x=>{if(!x.last||num(x.int)<=0)return'';const d=new Date(x.last+'T00:00:00');if(isNaN(d))return'';if(x.unit==='days')d.setDate(d.getDate()+num(x.int));else d.setMonth(d.getMonth()+num(x.int));return dstr(d)};
const T={name:'Maintenance-Log',
def:()=>({h:{site:'',area:'',grp:'',from:'',to:'',by:''},f:{t:'',s:''},rows:[],sch:[],sg:{a:'',b:'',c:''}}),
form(){const H=D.h;let h=card('Log details',`<div class="grid">${fld('h.site','Site / plant',H.site)}${fld('h.area','Area',H.area)}${fld('h.grp','Equipment group',H.grp)}${fld('h.by','Prepared by',H.by)}${fld('h.from','Period from',H.from,'date')}${fld('h.to','Period to',H.to,'date')}</div>`);
h+=card('Show in report',`<div class="grid">${sel('f.t','Type',D.f.t,[['','All types'],...TY])}${sel('f.s','Status',D.f.s,[['','All statuses'],...SS])}</div>`);
h+=card('Maintenance jobs',`<div class="quick">${PM.map((p,i)=>`<button data-a="pre" data-p="${i}">${p[0]}</button>`).join('')}</div>${D.rows.map((x,i)=>`<div class="en">${tl('r',`data-i="${i}"`)}<div class="grid">${fld(`rows.${i}.date`,'Date',x.date,'date')}${fld(`rows.${i}.tag`,'Equipment / tag no.',x.tag)}${sel(`rows.${i}.type`,'Type of work',x.type,TY)}${sel(`rows.${i}.status`,'Status',x.status,SS)}${fld(`rows.${i}.desc`,'Work done',x.desc,'textarea',true)}${fld(`rows.${i}.parts`,'Parts used',x.parts)}${fld(`rows.${i}.hrs`,'Hours spent',x.hrs,'number')}${fld(`rows.${i}.tech`,'Technician',x.tech)}${fld(`rows.${i}.rem`,'Remarks',x.rem)}</div></div>`).join('')}<button class="add" data-a="radd">+ Add job</button><button class="add" data-a="sort" style="margin-top:6px">Sort by date</button>`);
h+=card('Next-due schedule',`${D.sch.map((x,i)=>`<div class="en">${tl('s',`data-i="${i}"`)}<div class="grid">${fld(`sch.${i}.eq`,'Equipment / task',x.eq,'text',true)}${fld(`sch.${i}.last`,'Last done',x.last,'date')}${fld(`sch.${i}.int`,'Interval',x.int,'number')}${sel(`sch.${i}.unit`,'Unit',x.unit,['months','days'])}</div></div>`).join('')}<button class="add" data-a="sadd">+ Add schedule item</button>`);
return h+card('Signatures',`<div class="grid">${fld('sg.a','Technician',D.sg.a)}${fld('sg.b','Supervisor',D.sg.b)}${fld('sg.c','Manager',D.sg.c)}</div>`)},
act(a,d){const m=a.match(/^([rs])(up|dn|dup|del)$/);if(m){mv(m[1]==='r'?D.rows:D.sch,m[2],+d.i);return}
if(a==='radd')D.rows.push(nR());else if(a==='sadd')D.sch.push(nS());else if(a==='pre'){const p=PM[+d.p];D.rows.push({...nR(),type:p[1],desc:p[2]})}else if(a==='sort')D.rows.sort((x,y)=>(x.date||'').localeCompare(y.date||''))},
doc(){const H=D.h,R=D.rows.filter(x=>(x.desc||x.tag)&&(!D.f.t||x.type===D.f.t)&&(!D.f.s||x.status===D.f.s));
let h=hdr('MAINTENANCE LOG','')+meta([['Site / plant:',H.site],['Area:',H.area],['Equipment group:',H.grp],['Period:',[H.from,H.to].filter(Boolean).join(' to ')],['Prepared by:',H.by]]);
if(R.length){const by=TY.map(t=>[t,R.filter(x=>x.type===t).length]).filter(x=>x[1]);h+=`<div class="sumbox"><b>Summary:</b> ${R.length} job(s)${by.map(x=>` | ${x[0]}: ${x[1]}`).join('')} | Total hours: ${r2(R.reduce((a,x)=>a+num(x.hrs),0))} | Open or follow-up: ${R.filter(x=>x.status!=='Done').length}</div><table class="table" style="margin-top:10px"><thead><tr><th style="width:10%">Date</th><th style="width:13%">Equipment</th><th style="width:10%">Type</th><th style="width:28%">Work done</th><th style="width:6%">Hrs</th><th style="width:11%">Technician</th><th style="width:10%">Status</th><th style="width:12%">Remarks</th></tr></thead><tbody>${R.map(x=>`<tr><td>${e(x.date)}</td><td>${e(x.tag)}</td><td>${e(x.type)}</td><td>${linkify(x.desc)}${x.parts?`<br><i>Parts: ${e(x.parts)}</i>`:''}</td><td class="num">${e(x.hrs)}</td><td>${e(x.tech)}</td><td>${e(x.status)}</td><td>${linkify(x.rem)}</td></tr>`).join('')}</tbody></table>`}
const SC=D.sch.filter(x=>x.eq&&nxt(x)),td=today(),soon=dstr(new Date(Date.now()+30*864e5));
if(SC.length)h+=`<div class="sh">Next-due schedule</div><table class="table"><thead><tr><th style="width:34%">Equipment / task</th><th style="width:15%">Last done</th><th style="width:16%">Interval</th><th style="width:15%">Next due</th><th style="width:20%">Status</th></tr></thead><tbody>${SC.map(x=>{const n=nxt(x);return `<tr><td>${e(x.eq)}</td><td>${e(x.last)}</td><td>${num(x.int)} ${x.unit}</td><td>${n}</td><td>${n<td?'<span class="fail">OVERDUE</span>':n<=soon?'Due within 30 days':'OK'}</td></tr>`}).join('')}</tbody></table>`;
return h+sigs([sg('Technician',D.sg.a),sg('Supervisor',D.sg.b),sg('Manager',D.sg.c)])}};
const mk=()=>({o:{...OP},logo:'',...T.def()});let D=mk();
function setPath(p,v){const a=p.split('.');let o=D;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}
function form(){$('form').innerHTML=T.form()+card('Logo (optional)',`<input type="file" id="logo" accept="image/*">${D.logo?'<button data-a="rmLogo" style="margin-top:6px">Remove logo</button>':''}`)}
function draw(){const pg=$('page'),O=D.o;pg.className='t-'+O.tpl;pg.style.fontFamily=`"${O.font}",${O.font==='Calibri'?'Carlito,Arial,':''}${/Times|Georgia/.test(O.font)?'serif':'sans-serif'}`;pg.style.fontSize=O.fs+'pt';pg.style.setProperty('--ac',O.ac);pg.innerHTML=`<table class="pt"><thead><tr><td></td></tr></thead><tbody><tr><td>${T.doc()}</td></tr></tbody><tfoot><tr><td></td></tr></tfoot></table>`;fit()}
function fit(){const w=$('pv').clientWidth-32;if(w<=0)return;const pg=$('page'),mm=96/25.4;pg.style.zoom=1;const h=pg.offsetHeight;pg.style.zoom=Math.min(1,w/(210*mm));const bot=D.o.tpl==='compact'?12:14,n=Math.max(1,Math.ceil((h-(20+bot)*mm)/((277-bot)*mm)-.02));$('pgs').innerHTML=n===1?'<span class="ok">✓ Fits on 1 A4 page</span>':`<span class="warn">${n} pages</span>`}
$('form').addEventListener('input',ev=>{const t=ev.target;if(t.dataset.k){setPath(t.dataset.k,t.value);draw()}});
$('form').addEventListener('change',ev=>{const t=ev.target;if(t.id==='logo'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.logo=c.toDataURL('image/png');form();draw()};im.src=r.result};r.readAsDataURL(f)}else if(T.chg)T.chg(t)});
$('form').addEventListener('click',ev=>{const b=ev.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a;if(a==='rmLogo')D.logo='';else T.act(a,b.dataset);form();draw()});
['tpl','font','fs','ac'].forEach(k=>$(k).addEventListener('input',()=>{D.o[k]=$(k).value;draw()}));
$('print').onclick=()=>{const t=document.title,was=document.body.classList.contains('pvmode');document.body.classList.add('pvmode');document.title=T.name;addEventListener('afterprint',()=>{document.title=t;document.body.classList.toggle('pvmode',was)},{once:true});window.print()};
$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download=T.name+'-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('load').onclick=()=>$('loadf').click();$('loadf').onchange=ev=>{const f=ev.target.files[0];if(!f)return;f.text().then(t=>{try{D=mg(mk(),JSON.parse(t));refresh()}catch(_){alert('This file is not a valid data file for this tool.')}});ev.target.value=''};
$('reset').onclick=()=>{if(confirm('Clear all entries and start over?')){D=mk();refresh()}};
const tab=p=>{document.body.classList.toggle('pvmode',p);$('tE').className=p?'':'on';$('tP').className=p?'on':'';fit();scrollTo(0,0)};$('tE').onclick=()=>tab(false);$('tP').onclick=()=>tab(true);
const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('electralab-theme',t)}catch(_){}$('theme').textContent=t==='dark'?'Light mode':'Dark mode'};$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(document.documentElement.dataset.theme||'light');
function refresh(){['tpl','font','fs','ac'].forEach(k=>$(k).value=D.o[k]);form();draw()}addEventListener('resize',fit);refresh();
</script></body></html>
