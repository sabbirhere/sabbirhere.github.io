<script>
const e=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const lk=t=>e(t).replace(LK,(m,em)=>{const x=m.replace(/[.,;:!?)]+$/,''),r=m.slice(x.length);return A(em?'mailto:'+x:(/^https?:/i.test(x)?x:'https://'+x))+x+'</a>'+r});

const dt=x=>[x.start,x.end].filter(Boolean).map(e).join(' – ');
const j=(a,s=', ')=>a.filter(Boolean).map(e).join(s);
const SC={
exp:{t:'Experience',a:'experience',f:[['role','Job title'],['org','Company'],['loc','Location'],['gap',''],['start','Start date'],['end','End date (or Present)'],['desc','Responsibilities and achievements (one point per line; numbers are added automatically)',1]],
 r:x=>`<div class=e><div class=r><b>${e(x.role)}</b><span>${dt(x)}</span></div><div><i>${j([x.org,x.loc])}</i></div>${ul(x.desc)}</div>`},

 r:x=>`<div class=e><div class=r><b>${e(x.deg)}</b><span>${dt(x)}</span></div><div><i>${j([x.org,x.loc,x.gpa])}</i></div>${ul(x.desc)}</div>`},
skills:{t:'Skills',a:'skill group',f:[['cat','Category (e.g. Software)'],['items','Skills, comma separated',1]],
 r:x=>`<div class=e><b>${e(x.cat)}${x.cat?': ':''}</b>${lk(x.items)}</div>`},

 r:x=>`<div class=e><div class=r><b>${e(x.name)}</b><span>${u2(x.link)}</span></div>${ul(x.desc)}</div>`},

 r:x=>`<div class=e><div class=r><span><b>${e(x.name)}</b>${x.org?' – '+e(x.org):''}</span><span>${e(x.year)}</span></div></div>`},
lang:{t:'Languages',a:'language',f:[['name','Language'],['level','Level (e.g. Fluent)']],j:' • ',
 r:x=>e(x.name)+(x.level?' ('+e(x.level)+')':'')},

 r:x=>`<div class=e>${x.title?'<b>'+e(x.title)+'</b>':''}${ul(x.desc)}</div>`}
};

const ORDER=['exp','edu','skills','proj','cert','lang','oth'];
const has=x=>Object.keys(x).some(k=>k!='_o'&&x[k]);
const lbl=(x,k)=>{const c=SC[k].f,v=[x[c[0][0]],x[c[1][0]]].filter(Boolean).join(' – ').slice(0,60);return v||'New '+SC[k].a};

function draw(){

function fit(){const w=$('pv').clientWidth-32;if(w<=0)return;const pg=$('page'),mm=96/25.4;pg.style.zoom=1;const h=pg.offsetHeight;pg.style.zoom=Math.min(1,w/(210*mm));const bot=D.o.tpl==='compact'?10:14,n=Math.max(1,Math.ceil((h-(20+bot)*mm)/((277-bot)*mm)-.02));$('pgs').innerHTML=n==1?'<span class=ok>✓ Fits on 1 page</span>':`<span class=warn>${n} pages. For 1 page, try a smaller font or the Compact format.</span>`}

<p class=hint>Fixes spacing, capital letters, bullet symbols and common typos. Your browser also underlines spelling mistakes.</p>

$('form').addEventListener('keydown',ev=>{const t=ev.target;if(t.matches('textarea[data-k="desc"]')&&ev.key==='Enter'&&!ev.shiftKey){const before=t.value.slice(0,t.selectionStart),line=before.split(/\r?\n/).pop()||'';if(/^\s*\d+[.)]\s+/.test(line)){ev.preventDefault();const next=(Number((line.match(/^\s*(\d+)[.)]/)||[])[1])||0)+1;const start=t.selectionStart,end=t.selectionEnd;t.setRangeText('\n'+next+'. ',start,end,'end');t.dispatchEvent(new Event('input',{bubbles:true}));}}});

function aiPanel(details){let panel=details.querySelector('.ai-result');if(!panel){panel=document.createElement('div');panel.className='ai-result';panel.style.cssText='grid-column:1/-1;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--pn2)';details.querySelector('.grid').appendChild(panel)}return panel}
function electraNormLine(value){return String(value||'').trim().replace(/^(?:[•*\-–—]|\d+[.)])\s*/,'').replace(/\s+/g,' ').toLocaleLowerCase()}
function electraSplitResponsibilities(value){
 const out=[];
 String(value||'').split(/\r?\n/).forEach((row,lineIndex)=>{
  // Separate numbered/bulleted points pasted onto a shared line, then number each item consistently.
  const parts=row.trim().split(/\s+(?=(?:\d+[.)]\s+|[•*]\s+))/);
  parts.forEach(part=>{const raw=part.trim();const text=raw.replace(/^(?:[•*\-–—]|\d+[.)])\s*/,'').trim();if(text)out.push({raw,text,key:electraNormLine(text),lineIndex});});
 });
 return out;
}
function electraNumberResponsibilities(value){
 const items=electraSplitResponsibilities(value);
 return items.map((item,i)=>(i+1)+'. '+item.text).join('\n');
}
function electraAutoNumber(textarea){
 const before=textarea.value, start=textarea.selectionStart, end=textarea.selectionEnd;
 const numbered=electraNumberResponsibilities(before);
 if(numbered!==before){textarea.value=numbered;const delta=numbered.length-before.length;textarea.setSelectionRange(Math.min(numbered.length,start+delta),Math.min(numbered.length,end+delta));textarea.dispatchEvent(new Event('input',{bubbles:true}));}
}
function electraExtractText(data){
 if(typeof data==='string')return data;
 if(!data||typeof data!=='object')return '';
 let value=data.text??data.output??data.result??data.response??data.content??data.message??'';
 if(value&&typeof value==='object')value=value.text??value.content??value.output??'';
 if(!value&&Array.isArray(data.choices))value=data.choices[0]?.message?.content??data.choices[0]?.text??'';
 if(Array.isArray(value))value=value.map(x=>typeof x==='string'?x:(x.text||x.content||'')).join('\n');
 return typeof value==='string'?value:'';
}

 const input=panel.closest('details')?.querySelector('textarea[data-k="desc"]');
 const currentKeys=new Set((input?.value||'').split(/\r?\n/).map(electraNormLine).filter(Boolean));
 const items=(entry._electraAIItems||[]).filter(x=>x.action===actionKey&&!x.inserted&&currentKeys.has(x.sourceKey));
 panel.innerHTML=(failed?'<p class="hint" role="alert">AI not available now.</p>':'')+'<b>Electra AI results</b><p class="hint">Each request contains one responsibility point. Insert replaces only its matching original point. Already inserted AI text is skipped.</p><div class="ai-line-results"></div><div class="ai-tools"><button type="button" class="ai-again">Check for new points</button><button type="button" class="ai-cancel">Close</button></div>';
 const box=panel.querySelector('.ai-line-results');
 items.forEach((item,n)=>{
  const card=document.createElement('div');card.style.cssText='border:1px solid var(--line);border-radius:4px;padding:8px;margin-top:8px';
  const from=document.createElement('p');from.className='hint';from.textContent='Original line: '+item.source;
  const label=document.createElement('label');label.className='f';label.textContent='AI result';
  const output=document.createElement('textarea');output.className='ai-suggestion';output.rows=3;output.spellcheck=true;output.value=item.result;
  const insert=document.createElement('button');insert.type='button';insert.className='ai-insert';insert.textContent='Insert';insert.dataset.itemId=item.id;
  const note=document.createElement('span');note.className='hint';note.style.marginLeft='8px';note.textContent='Not inserted';
  label.appendChild(output);card.append(from,label,insert,note);box.appendChild(card);
 });
 if(!items.length&&!failed){const note=document.createElement('p');note.className='hint';note.textContent='No new responsibility lines to send. Add or edit a line, then run Electra AI Assistant again.';box.appendChild(note)}
}

/* ---- CV check (detection) ---- */
function chk(){const el=$('chk');if(!el)return;const P=D.p,S=D.s,out=[],bad=t=>out.push('<div class=ck><b>Fix:</b> '+e(t)+'</div>'),tip=t=>out.push('<div class=ck><i>Tip:</i> '+e(t)+'</div>');
 if(!P.name)bad('Add your full name.');
 if(!P.email)bad('Add an email address.');else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(P.email))bad('The email address looks invalid.');
 if(!P.phone)tip('Add a phone number so recruiters can call you.');
 if(P.summary){const n=P.summary.length;if(n>600)tip('Your summary is long ('+n+' characters). Aim for 2–4 sentences.');else if(n<80)tip('Your summary is very short.')}
 if(!(S.exp||[]).some(has)&&!(S.edu||[]).some(has))tip('Add your experience or education.');
 const all=[];['exp','edu','proj','oth'].forEach(k=>(S[k]||[]).forEach(q=>String(q.desc||'').split('\n').forEach(l=>l.trim()&&all.push(l.trim()))));
 const text=[P.summary,...all].filter(Boolean).join('\n');
 if(/\b(I|I'm|my|me)\b/.test(text))tip('Avoid "I", "my" and "me". CVs read better without first person.');
 const weak=all.filter(l=>/^(responsible for|worked on|helped|assisted with|duties included)/i.test(l)).length;
 if(weak)tip(weak+' bullet(s) start with a weak phrase. Start with an action verb instead (Led, Built, Reduced).');
 if(all.length>=3&&!all.some(l=>/\d/.test(l)))tip('Add numbers to your bullets (%, amounts, team size) to show impact.');
 const lg=all.filter(l=>l.length>200).length;if(lg)tip(lg+' bullet(s) are over 200 characters. Shorter bullets are easier to scan.');
 const dp=text.match(/\b([A-Za-z]+)\s+\1\b/i);if(dp)tip('Repeated word: "'+dp[0]+'".');
 ['exp','edu'].forEach(k=>(S[k]||[]).forEach(q=>{const y=s=>(String(s||'').match(/(19|20)\d\d/)||[])[0];if(y(q.start)&&y(q.end)&&y(q.end)<y(q.start))bad('"'+lbl(q,k)+'" ends before it starts.')}));
 el.innerHTML='<h3>CV check</h3><div class=in>'+(out.length?out.join(''):'<span class=ok>✓ No issues found.</span>')+'</div>'}

const TY={teh:'the',recieve:'receive',managment:'management',experiance:'experience',responsability:'responsibility',enviroment:'environment',sucessful:'successful',sucessfully:'successfully',acheived:'achieved',acheivement:'achievement',developement:'development',definately:'definitely',seperate:'separate',occured:'occurred',untill:'until',maintainance:'maintenance',knowlege:'knowledge',proffesional:'professional',comunication:'communication',adress:'address'};
function fix(s,k,v,ta){
 if(k=='email')return v.toLowerCase().replace(/\s/g,'');
 if(k=='web'||k=='link')return v.replace(/\s/g,'');
 if(k=='phone')return v.replace(/[ \t]{2,}/g,' ').trim();
 let L=v.replace(/\r/g,'').split('\n').map(l=>l.replace(/[ \t]{2,}/g,' ').replace(/\s+([,.;:!?])/g,'$1').replace(/,(?=[A-Za-z])/g,', ').replace(/\b[a-z]+\b/gi,w=>TY[w.toLowerCase()]||w).trim());
 if(ta)L=L.map(l=>l.replace(/^[\-*•·▪●–—]+\s*/,''));
 L=L.map(l=>l.charAt(0).toUpperCase()+l.slice(1));
 if(ta&&k!='summary')L=L.filter(Boolean);
 v=L.join('\n').trim();
 if(s=='p'&&k=='name'&&(v==v.toLowerCase()||v==v.toUpperCase()))v=v.toLowerCase().replace(/(^|[\s'-])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
 return v}
