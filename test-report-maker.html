<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Report Maker | ElectraLab</title>
<style>

.body{padding:14px 16px 40px}.card{border:1px solid var(--line);border-radius:6px;margin-bottom:14px}.card>h3{margin:0;padding:9px 12px;font-size:14px;background:var(--pn2);border-bottom:1px solid var(--line);border-radius:6px 6px 0 0}.in{padding:10px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .w{grid-column:1/-1}
.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}input,select,textarea,button{font:inherit;color:var(--ink)}input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--inp)}textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ui);outline-offset:1px}button{padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--inp);cursor:pointer}button:hover{background:var(--pn2)}.pri{background:var(--ui);color:var(--onui);border-color:var(--ui);flex:1}.pri:hover{background:var(--ui);filter:brightness(1.12)}
.en{border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px;background:var(--pn2)}.tools{display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px}.tools button{padding:2px 8px}.add{width:100%;border-style:dashed}.hint{font-size:12px;color:var(--mut);margin:6px 0 0}.badge{font-size:12px;color:var(--mut)}.ok{color:#15803d}.warn{color:#b45309}.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.quick button{font-size:12px}.switch{display:flex;gap:4px;flex-wrap:wrap}.switch button{flex:1}.switch .on{background:var(--ui);color:var(--onui);border-color:var(--ui)}details summary{cursor:pointer;font-size:12px;color:var(--mut)}
.preview{overflow:auto;padding:16px;height:calc(100vh - 88px)}#page{background:#fff;width:210mm;min-height:297mm;margin:0 auto;padding:20mm 14mm 14mm 20mm;box-shadow:0 2px 12px #0003;color:#111;line-height:1.35}
#page header{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px;border-bottom:1px solid #d1d5db;padding-bottom:8px}.logo{width:30mm;height:20mm;object-fit:contain;object-position:left top}.hd{flex:1}#page h1{margin:0;font-size:1.7em;line-height:1.1}#page a{color:inherit;text-decoration:underline}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;margin:8px 0 12px;padding:7px;border:1px solid #d1d5db;break-inside:avoid}.sh{font-size:1.02em;font-weight:700;margin:12px 0 4px;break-after:avoid}
.table{width:100%;border-collapse:collapse;table-layout:fixed}.table th,.table td{border:1px solid #bfc4cc;padding:4px 5px;vertical-align:top;overflow-wrap:anywhere}.table th{background:#f3f4f6;text-align:left}.table .num{text-align:right}.table .c{text-align:center}.table tr{break-inside:avoid;page-break-inside:avoid}
.pass{color:#15803d;font-weight:700}.fail{color:#b91c1c;font-weight:700;text-decoration:underline}.sumbox,.words{border:1px solid #d1d5db;padding:7px;margin-top:10px;break-inside:avoid}.notes p{margin:3px 0}
.totals{margin:10px 0 0 auto;width:70%;break-inside:avoid}.totals div{display:flex;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding:3px 0}.totals .grand{font-weight:700;border-top:2px solid #111;border-bottom:0;padding-top:6px}
.signs{display:grid;gap:12mm;margin-top:12px;padding-top:14mm;break-inside:avoid}.signline{border-top:1px solid #555;padding-top:4px;min-height:14mm}
.t-modern h1,.t-modern .sh{color:var(--ac)}.t-modern header{border-bottom:2px solid var(--ac)}.t-modern .table th{background:#eef2ff}.t-compact{padding:20mm 12mm 12mm 20mm!important}.t-compact .table th,.t-compact .table td{padding:2px 3px}.t-minimal h1{font-weight:300;font-size:2.1em}.t-minimal header{border:0}.t-minimal .table th{background:#fff}.t-minimal .table td,.t-minimal .table th{border-left:0;border-right:0}
.top{min-height:56px;display:flex;align-items:center;gap:14px;padding:6px 16px;background:var(--pn);border-bottom:1px solid var(--line)}.top .back{display:inline-block;padding:6px 14px;border:1px solid var(--ui);border-radius:4px;color:var(--ui);background:var(--inp);text-decoration:none;font-weight:600;white-space:nowrap}.top .back:hover{background:var(--ui);color:var(--onui)}.ttl{flex:1;display:flex;flex-direction:column;line-height:1.25}.ttl b{font-size:17px}.tg{font-size:12px;color:var(--mut)}.foot{min-height:32px;display:flex;align-items:center;justify-content:center;padding:4px 16px;background:var(--pn);border-top:1px solid var(--line);color:var(--mut);font-size:11.5px;text-align:center}
.tabs{display:none}@media(max-width:900px){.app{display:block;height:auto}.panel{overflow:visible;border:0}.preview{height:auto}.tabs{display:flex;position:sticky;top:0;z-index:3;background:var(--pn);border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;border-radius:0;padding:10px}.tabs .on{border-bottom:2px solid var(--ui);font-weight:600}body.pvmode .panel{display:none}body:not(.pvmode) .preview{display:none}}
.pt{width:100%;border-collapse:collapse;table-layout:fixed}.pt>thead>tr>td,.pt>tbody>tr>td,.pt>tfoot>tr>td{padding:0;border:0}.pt>thead>tr>td,.pt>tfoot>tr>td{height:0}
.xtrow{display:grid;grid-template-columns:1.2fr 1.1fr .9fr .55fr .9fr .7fr 1.2fr auto;gap:7px;align-items:center;margin:8px 0}.xtrow input,.xtrow select{min-width:0}.presetbar{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}@media(max-width:900px){.xtrow{grid-template-columns:1fr 1fr}}@media print{body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.top,.foot,.tabs{display:none!important}.app{display:block;height:auto}.panel{display:none}.preview{padding:0;overflow:visible;height:auto}#page{box-shadow:none;width:auto;min-height:0;padding:0 14mm 0 20mm!important;zoom:1!important}#page.t-compact{padding:0 12mm 0 20mm!important}.pt>thead>tr>td{height:20mm}.pt>tfoot>tr>td{height:14mm}.t-compact .pt>tfoot>tr>td{height:12mm}@page{size:A4;margin:0}}
@media(min-width:901px){.app{grid-template-columns:clamp(400px,36vw,500px) 1fr;height:calc(100vh - 88px);height:calc(100dvh - 88px)}.preview{height:calc(100vh - 88px);height:calc(100dvh - 88px)}}
@media(max-width:900px){.bar{position:static;grid-template-columns:repeat(4,1fr)}.body{max-width:760px;margin:0 auto;padding:12px 14px 60px}.tabs button{min-height:44px;font-size:15px}.preview{padding:8px}}
@media(max-width:600px){.bar{grid-template-columns:1fr 1fr}.body{padding:10px 10px 60px}.in{padding:8px}.grid{grid-template-columns:1fr}.en .grid{grid-template-columns:1fr 1fr}.en .grid .w{grid-column:1/-1}.tools{flex-wrap:wrap}.tools button{flex:1;min-height:38px}.top{gap:8px;padding:6px 10px;flex-wrap:wrap}.tg{display:none}.top .back{padding:6px 10px;font-size:13px}.ttl b{font-size:15px}.foot{font-size:11px;padding:6px 10px}input[type=text],input[type=date],input[type=number],select,textarea{font-size:16px}}
@media(pointer:coarse){button,select,input[type=text],input[type=date],input[type=number]{min-height:40px}}

.test-strip-wrap{width:100%;overflow:hidden}
.test-strip{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:3px 2px 10px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.test-block{flex:0 0 135px;min-height:62px;padding:9px 8px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);font-weight:600;cursor:pointer;white-space:normal;line-height:1.15}
.test-block.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.test-block:hover{transform:translateY(-1px)}
.custom-test-bar{margin-top:7px}
.custom-test-btn{width:100%}
#xtrows{overflow-x:auto;overflow-y:hidden}
#xtrows .xtrow{min-width:900px}
@media(max-width:700px){.test-block{flex-basis:118px;min-height:58px;font-size:.82rem}}
</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('electralab-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script></head>
<body>
<div class="top"><a class="back" href="Docs.html">← Back to DOCBOX</a><div class="ttl"><b>ElectraLab Docs</b><span class="tg">Test Reports: insulation resistance, earth resistance and commissioning checklists</span></div><button id="theme" type="button">Dark mode</button></div>
<div class="tabs"><button class="on" id="tE">Edit</button><button id="tP">Preview</button></div>
<div class="app"><div class="panel"><div class="bar">

<div class="full"><button class="pri" id="print">Print / Save as PDF (A4)</button></div>
<div class="full"><button id="save">Save JSON</button><button id="load">Load JSON</button><button id="reset">Reset</button><input type="file" id="loadf" accept=".json" hidden></div>
<div class="full badge" id="pgs"></div>
</div><div class="body" id="form"></div></div><div class="preview" id="pv"><div id="page"></div></div></div>
<footer class="foot">Free, safe and private: no sign-up, no tracking, no data stored on any server. Everything you type stays in your browser and never leaves your device.</footer>
<script>
const $=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:0},r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const z2=n=>String(n).padStart(2,'0'),dstr=d=>`${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`,today=()=>dstr(new Date());
const LK=/([\w.+-]+@[\w-]+(?:\.[\w-]+)+)|((?:https?:\/\/|www\.)[^\s<]+)/gi;
const linkify=t=>e(t).replace(LK,(m,em)=>{const x=m.replace(/[.,;:!?)]+$/,''),r=m.slice(x.length),h=em?'mailto:'+x:(/^https?:/i.test(x)?x:'https://'+x);return `<a href="${h}" target="_blank" rel="noopener">${x}</a>${r}`}).replace(/\n/g,'<br>');
const fld=(k,l,v,t='text',w=false)=>`<label class="f${w?' w':''}">${l}${t==='textarea'?`<textarea data-k="${k}">${e(v)}</textarea>`:`<input type="${t}" data-k="${k}" value="${e(v)}">`}</label>`;
const sel=(k,l,v,o,w=false)=>`<label class="f${w?' w':''}">${l}<select data-k="${k}">${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return `<option value="${e(a)}"${a==v?' selected':''}>${e(b)}</option>`}).join('')}</select></label>`;
const card=(t,b)=>`<div class="card"><h3>${t}</h3><div class="in">${b}</div></div>`;
const tl=(px,d)=>`<div class="tools">${[['up','↑'],['dn','↓'],['dup','Duplicate'],['del','Remove']].map(([a,t])=>`<button data-a="${px}${a}" ${d}>${t}</button>`).join('')}</div>`;
function mv(A,a,i){if(a==='del')A.splice(i,1);else if(a==='dup')A.splice(i+1,0,JSON.parse(JSON.stringify(A[i])));else if(a==='up'&&i>0)[A[i-1],A[i]]=[A[i],A[i-1]];else if(a==='dn'&&i<A.length-1)[A[i+1],A[i]]=[A[i],A[i+1]]}
const hdr=(t,s)=>`<header>${D.logo?`<img class="logo" src="${D.logo}" alt="">`:''}<div class="hd"><h1>${t}</h1>${s?`<div>${s}</div>`:''}</div></header>`;
const meta=p=>{p=p.filter(x=>x[1]);return p.length?`<div class="meta">${p.map(x=>`<div><b>${x[0]}</b> ${e(x[1])}</div>`).join('')}</div>`:''};
const sg=(l,n)=>`${n?`<b>${e(n)}</b><br>`:''}${l}`,sigs=a=>`<div class="signs" style="grid-template-columns:repeat(${a.length},1fr)">${a.map(x=>`<div class="signline">${x}</div>`).join('')}</div>`;
const OP={tpl:'classic',font:'Arial',fs:'9.5',ac:'#1e3a8a'};
const mg=(b,x)=>{if(typeof b!=='object'||b===null||Array.isArray(b))return x===undefined?b:x;const o={...b};if(x&&typeof x==='object')for(const k in x)o[k]=k in b?mg(b[k],x[k]):x[k];return o};
const nXT=()=>({name:'',param:'',reading:'',unit:'',limit:'',result:'',remarks:''});
const nIR=()=>({id:'',a:'',b:'',c:'',n:'',ll:''}),nEA=()=>({id:'',loc:'',type:'',depth:'',soil:'Dry',ohm:'',max:'',rem:''}),nCI=()=>({t:'',s:'',r:''});
const vn=s=>{const t=String(s??'').trim().replace(/^[>≥]\s*/,''),n=parseFloat(t);return t===''||!Number.isFinite(n)?null:n};
const rs=ok=>ok===null?'':ok?'<span class="pass">PASS</span>':'<span class="fail">FAIL</span>';
const irEval=x=>{const v=['a','b','c','n','ll'].map(k=>vn(x[k])).filter(k=>k!==null);return v.length?v.every(k=>k>=num(D.min)):null};
const eaLim=x=>x.max!==''?num(x.max):num(D.emax),eaEval=x=>{const v=vn(x.ohm);return v===null?null:v<=eaLim(x)};
const sm=r=>{const p=r.filter(x=>x===true).length,f=r.filter(x=>x===false).length;return `<div class="sumbox"><b>Result summary:</b> ${p} passed, ${f} failed. ${f?'<span class="fail">OVERALL: FAIL</span>':p?'<span class="pass">OVERALL: PASS</span>':''}</div>`};
const CL={panel:[['Visual and mechanical',['Enclosure, doors and gland plates undamaged','Busbars, joints and supports clean and tight','Cable terminations tight and ferruled','Earth bonding connected','Spare openings sealed']],['Electrical and protection',['Insulation resistance tested and recorded','Incoming and outgoing breakers operate correctly','Relay and overload settings applied as per schedule','Meters, indicators and push buttons working','Interlocks and emergency stop tested']],['Labeling and safety',['Circuit labels and single line diagram fitted','Danger and warning signs fitted','Panel cleaned, tools and debris removed']]],
trans:[['Visual and mechanical',['Nameplate data matches the design','Tank, bushings and radiator free of leaks and damage','Oil level and breather (silica gel) normal','Tank and neutral earthing connected']],['Electrical and protection',['Insulation resistance (HV-E, LV-E, HV-LV) recorded','Turns ratio and winding resistance recorded','Tap changer position set as required','Buchholz relay and temperature protection tested','Cable terminations and bus ducts tight']],['Safety',['Fire barrier and oil pit in order','Danger signs and labels fitted','Area clean and accessible']]]};
const T={name:'Test-Report',
def:()=>({type:'ir',h:{project:'',site:'',equip:'',date:today(),by:'',inst:'',serial:'',cal:'',cond:''},volt:'500',min:'1',emax:'5',next:'',ir:[nIR()],ea:[nEA()],cm:[{name:'Visual checks',items:[nCI()]}],xt:[],rem:'',sg:{a:'',b:'',c:''}}),
form(){const H=D.h;let h=card('Test selection',`<div class="test-strip-wrap"><div class="test-strip">
${[['ir','Insulation resistance'],['earth','Earth resistance'],['comm','Commissioning checklist']].map(([k,l])=>`<button class="test-block ${D.type===k?'on':''}" data-a="type" data-t="${k}">${l}</button>`).join('')}

<button class="test-block" data-a="xtpreset" data-name="Voltage">Voltage</button>
<button class="test-block" data-a="xtpreset" data-name="Phase sequence">Phase sequence</button>
<button class="test-block" data-a="xtpreset" data-name="RCD / ELCB">RCD / ELCB</button>
<button class="test-block" data-a="xtpreset" data-name="Polarity">Polarity</button>
<button class="test-block" data-a="xtpreset" data-name="Earth loop impedance">Earth loop impedance</button>
<button class="test-block" data-a="xtpreset" data-name="Functional test">Functional test</button>
</div></div>
<div class="custom-test-bar"><button class="custom-test-btn" data-a="xtpreset" data-name="Custom test">+ Custom Test</button></div>
<p class="hint">Pass/fail limits are editable defaults. Always follow your project specification and local standards.</p>`);
h+=card('Report details',`<div class="grid">${fld('h.project','Project',H.project,'text',true)}${fld('h.site','Site / location',H.site)}${fld('h.equip','Equipment / panel / feeder',H.equip)}${fld('h.date','Test date',H.date,'date')}${fld('h.by','Tested by',H.by)}${fld('h.inst','Instrument model',H.inst)}${fld('h.serial','Instrument serial no.',H.serial)}${fld('h.cal','Calibration due',H.cal,'date')}${fld('h.cond','Weather / soil condition',H.cond,'text',true)}</div>`);
if(D.type==='ir')h+=card('Insulation resistance readings',`<div class="grid">${sel('volt','Test voltage (V)',D.volt,['250','500','1000','2500','5000'])}${fld('min','Minimum acceptable (MΩ)',D.min,'number')}</div><div style="margin-top:8px">${D.ir.map((x,i)=>`<div class="en">${tl('r',`data-i="${i}"`)}<div class="grid">${fld(`ir.${i}.id`,'Circuit / cable / equipment',x.id,'text',true)}${[['a','L1-E (MΩ)'],['b','L2-E (MΩ)'],['c','L3-E (MΩ)'],['n','N-E (MΩ)'],['ll','L-L (MΩ)']].map(([k,l])=>fld(`ir.${i}.${k}`,l,x[k])).join('')}</div></div>`).join('')}</div><button class="add" data-a="radd">+ Add row</button>`);

return h+card('Remarks and signatures',`${fld('rem','Remarks',D.rem,'textarea',true)}<div class="grid" style="margin-top:8px">${fld('sg.a','Tested by',D.sg.a)}${fld('sg.b','Witnessed by',D.sg.b)}${fld('sg.c','Approved by',D.sg.c)}</div>`)},
act(a,d){const i=+d.i,g=+d.g,m=a.match(/^([rgi])(up|dn|dup|del)$/),R=D.type==='ir'?D.ir:D.ea;
if(m){mv(m[1]==='r'?R:m[1]==='g'?D.cm:D.cm[g].items,m[2],i);return}
if(a==='addxt'){D.xt=D.xt||[];D.xt.push(nXT())}else if(a==='xtpreset'){D.xt=D.xt||[];const n=d.name,x=nXT(),P={'Continuity':['Continuity','Conductor / circuit','','Ω','','',''],'Voltage':['Voltage','L-L / L-N / L-E','','V','','',''],'Phase sequence':['Phase sequence','L1-L2-L3','','','','',''],'RCD / ELCB':['RCD / ELCB','Trip time / test current','','ms / mA','','',''],'Polarity':['Polarity','Line / neutral / earth','','','','',''],'Earth loop impedance':['Earth loop impedance','Loop impedance','','Ω','','',''],'Functional test':['Functional test','Equipment operation','','','','',''],'Custom test':['Custom test','Parameter','','','','','']}[n]||[n,'','','','','',''];[x.name,x.param,x.reading,x.unit,x.limit,x.result,x.remarks]=P;D.xt.push(x)}else if(a==='xtdel'){D.xt.splice(+d.i,1)}else if(a==='type')D.type=d.t;else if(a==='radd')R.push(D.type==='ir'?nIR():nEA());
else if(a==='radd8'){if(D.ea.length===1&&!D.ea[0].id&&!D.ea[0].ohm)D.ea=[];for(let k=0;k<8;k++){const r=nEA();r.id='Pit '+(D.ea.length+1);D.ea.push(r)}}
else if(a==='gadd')D.cm.push({name:'New group',items:[nCI()]});else if(a==='iadd')D.cm[g].items.push(nCI());
else if(a==='tpl')D.cm=CL[d.p].map(([n,L])=>({name:n,items:L.map(t=>({t,s:'',r:''}))}))},
doc(){const H=D.h,ty=D.type,tt={ir:'INSULATION RESISTANCE TEST REPORT',earth:'EARTH RESISTANCE TEST REPORT',comm:'COMMISSIONING CHECKLIST'}[ty];
let h=hdr(tt,'')+meta([['Project:',H.project],['Site:',H.site],['Equipment:',H.equip],['Test date:',H.date],['Tested by:',H.by],['Instrument:',H.inst],['Serial no.:',H.serial],['Calibration due:',H.cal],['Conditions:',H.cond]]);

if(ty==='earth'){const R=D.ea.filter(x=>x.id||x.loc||x.ohm!=='');h+=`<div class="sh">Maximum allowed: ${e(D.emax)} Ω${D.next?` | Next test date: ${e(D.next)}`:''}</div><table class="table"><thead><tr><th style="width:20%">Pit ID / location</th><th style="width:14%">Electrode</th><th style="width:9%">Depth</th><th style="width:9%">Soil</th><th style="width:10%">Measured (Ω)</th><th style="width:9%">Limit (Ω)</th><th style="width:10%">Result</th><th style="width:19%">Remarks</th></tr></thead><tbody>${R.length?R.map(x=>`<tr><td>${e(x.id)}${x.loc?'<br>'+e(x.loc):''}</td><td>${e(x.type)}</td><td>${e(x.depth)}</td><td>${e(x.soil)}</td><td class="num">${e(x.ohm)}</td><td class="num">${eaLim(x)}</td><td class="c">${rs(eaEval(x))}</td><td>${linkify(x.rem)}</td></tr>`).join(''):'<tr><td colspan="8">No readings entered</td></tr>'}</tbody></table>`+sm(R.map(eaEval))}
if(ty==='comm'){const G=D.cm.map(g=>({name:g.name,items:g.items.filter(x=>x.t)})).filter(g=>g.items.length),all=G.flatMap(g=>g.items),n=s=>all.filter(x=>x.s===s).length,bl=all.filter(x=>!x.s).length;
G.forEach((g,k)=>{h+=`<div class="sh">${k+1}. ${e(g.name)}</div><table class="table"><thead><tr><th style="width:7%">No.</th><th style="width:45%">Check item</th><th style="width:8%">OK</th><th style="width:9%">Not OK</th><th style="width:8%">N/A</th><th style="width:23%">Remarks</th></tr></thead><tbody>${g.items.map((x,i)=>`<tr><td>${k+1}.${i+1}</td><td>${linkify(x.t)}</td><td class="c">${x.s==='ok'?'✓':''}</td><td class="c">${x.s==='no'?'<span class="fail">✗</span>':''}</td><td class="c">${x.s==='na'?'–':''}</td><td>${linkify(x.r)}</td></tr>`).join('')}</tbody></table>`});
if(all.length)h+=`<div class="sumbox"><b>Result summary:</b> ${n('ok')} OK, ${n('no')} not OK, ${n('na')} N/A, ${bl} not checked. ${n('no')?'<span class="fail">OVERALL: FAIL</span>':bl?'<b>INCOMPLETE</b>':'<span class="pass">OVERALL: PASS</span>'}</div>`}
if(D.xt&&D.xt.length)h+=`<div class="sh">Additional Tests</div><table class="table"><thead><tr><th>Test</th><th>Parameter</th><th>Reading</th><th>Unit</th><th>Limit / Required</th><th>Result</th><th>Remarks</th></tr></thead><tbody>${D.xt.map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.param)}</td><td>${e(x.reading)}</td><td>${e(x.unit)}</td><td>${e(x.limit)}</td><td>${e(x.result)}</td><td>${e(x.remarks)}</td></tr>`).join('')}</tbody></table>`;if(D.rem)h+=`<div class="notes"><div class="sh">Remarks</div><p>${linkify(D.rem)}</p></div>`;
return h+sigs([sg('Tested by',D.sg.a),sg('Witnessed by',D.sg.b),sg('Approved by',D.sg.c)])}};
const mk=()=>({o:{...OP},logo:'',...T.def()});let D=mk();
function setPath(p,v){const a=p.split('.');let o=D;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}

function draw(){const pg=$('page'),O=D.o;pg.className='t-'+O.tpl;pg.style.fontFamily=`"${O.font}",${O.font==='Calibri'?'Carlito,Arial,':''}${/Times|Georgia/.test(O.font)?'serif':'sans-serif'}`;pg.style.fontSize=O.fs+'pt';pg.style.setProperty('--ac',O.ac);pg.innerHTML=`<table class="pt"><thead><tr><td></td></tr></thead><tbody><tr><td>${T.doc()}</td></tr></tbody><tfoot><tr><td></td></tr></tfoot></table>`;fit()}
function fit(){const w=$('pv').clientWidth-32;if(w<=0)return;const pg=$('page'),mm=96/25.4;pg.style.zoom=1;const h=pg.offsetHeight;pg.style.zoom=Math.min(1,w/(210*mm));const bot=D.o.tpl==='compact'?12:14,n=Math.max(1,Math.ceil((h-(20+bot)*mm)/((277-bot)*mm)-.02));$('pgs').innerHTML=n===1?'<span class="ok">✓ Fits on 1 A4 page</span>':`<span class="warn">${n} pages</span>`}
