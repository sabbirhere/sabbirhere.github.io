function wlist(){const M=desig(),F=items.filter(i=>i.t=='fer');return wires.map(w=>{const f=F.filter(x=>x.wid==w.id),a=f.find(x=>!x.we),b=f.find(x=>x.we==1);return[(f[0]||{}).lab||'-',NM[w.c],endAt(w.pts[0],M),endAt(w.pts[w.pts.length-1],M),a?a.lab:'-',b?b.lab:'-']}).sort(nat)}
function fsch(){const g={};items.filter(i=>i.t=='fer').forEach(f=>{const c=NM[f.wc]||'White',k=f.lab+'|'+c;(g[k]=g[k]||[f.lab,c,0])[2]++});return Object.values(g).sort(nat)}
const tbl=(h,r)=>'<table><tr>'+h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>'+(r.length?r.map(x=>'<tr>'+x.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+h.length+'">Nothing yet</td></tr>')+'</table>';
let CS=null;
function showM(t,secs,f){CS={f,secs};$('#mc').innerHTML='<h3>'+t+(TB.p?' - '+esc(TB.p):'')+'</h3>'+secs.map(s=>'<h4>'+s[0]+'</h4>'+tbl(s[1],s[2])).join('');$('#md').hidden=0}
$('#bbm').onclick=()=>showM('Parts list',[['Parts',['Part','Rating / size','Qty','Designators'],bom()]],'parts-list.csv');
$('#bwl').onclick=()=>showM('Wire list &amp; ferrule schedule',[['Wire list',['Wire no.','Colour','From','To','Ferrule (from)','Ferrule (to)'],wlist()],['Ferrule schedule',['Ferrule no.','Colour','Qty'],fsch()]],'wire-list.csv');
$('#bmore').onclick=e=>{const o=document.body.classList.toggle('more');e.target.innerHTML=o?'Less &#9652;':'More &#9662;'};
$('#btk').onclick=e=>{const o=document.body.classList.toggle('tbo');e.target.innerHTML=o?'Title block &#9652;':'Title block &#9662;'};
$('#mx').onclick=()=>$('#md').hidden=1;
$('#mcsv').onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';dlf(CS.f,'\ufeff'+CS.secs.map(s=>[[s[0]],s[1],...s[2],[]].map(r=>r.map(q).join(',')).join('\n')).join('\n'))};
</script></body></html>
