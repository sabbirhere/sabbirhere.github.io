<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cover Letter Builder | ElectraLab</title>
<style>
:root{color-scheme:light;--ink:#1f2937;--mut:#6b7280;--line:#d1d5db;--bg:#eef0f3;--pn:#fff;--pn2:#f9fafb;--inp:#fff;--ui:#0369a1;--onui:#fff;--ac:#1e3a8a}
[data-theme=dark]{color-scheme:dark;--ink:#e5e7eb;--mut:#9ca3af;--line:#2b3547;--bg:#0b1220;--pn:#111a2b;--pn2:#17213a;--inp:#0f1727;--ui:#38bdf8;--onui:#06222f}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:grid;grid-template-columns:430px 1fr;height:calc(100vh - 88px)}.panel{overflow:auto;background:var(--pn);border-right:1px solid var(--line)}
.bar{position:sticky;top:0;z-index:2;background:var(--pn);border-bottom:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}.bar .full{grid-column:1/-1;display:flex;gap:8px;flex-direction:row}
.body{padding:14px 16px 40px}.card{border:1px solid var(--line);border-radius:6px;margin-bottom:14px}.card>h3{margin:0;padding:9px 12px;font-size:14px;background:var(--pn2);border-bottom:1px solid var(--line);border-radius:6px 6px 0 0}.in{padding:10px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .w{grid-column:1/-1}
.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}input,select,textarea,button{font:inherit;color:var(--ink)}
input[type=text],input[type=date],input[type=email],input[type=url],input[type=number],select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--inp)}textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ui);outline-offset:1px}button{padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--inp);cursor:pointer}button:hover{background:var(--pn2)}
.pri{background:var(--ui);color:var(--onui);border-color:var(--ui);flex:1}.pri:hover{background:var(--ui);filter:brightness(1.12)}.en{border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px;background:var(--pn2)}
.tools{display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px}.tools button{padding:2px 8px}.add{width:100%;border-style:dashed}.hint{font-size:12px;color:var(--mut);margin:6px 0 0}
.preview{overflow:auto;padding:16px;height:calc(100vh - 88px)}#page{background:#fff;width:210mm;min-height:297mm;margin:0 auto;padding:20mm 14mm 14mm 20mm;box-shadow:0 2px 12px #0003;color:#111;line-height:1.45}
#page header{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}.hd{flex:1}#page h1{margin:0;font-size:2em;line-height:1.1}#page .ct{margin-top:5px;font-size:.92em;color:#374151}#page h2{font-size:1.05em;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 7px;padding-bottom:3px;border-bottom:1px solid #111}#page p{margin:0 0 11px}.letter-meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:14px}.recipient{white-space:pre-line}.subject{font-weight:700;margin:15px 0 12px}.bodyp{break-inside:avoid}.closing{margin-top:18px;break-inside:avoid}.sig{min-height:34px;margin-top:14px}.enc{margin-top:16px;break-inside:avoid}
.t-modern h1,.t-modern h2{color:var(--ac)}.t-modern h2{border-bottom:2px solid var(--ac)}.t-compact{padding:20mm 12mm 12mm 20mm!important}.t-compact h2{background:#f3f4f6;border:0;border-left:4px solid var(--ac);padding:2px 6px;margin:10px 0 5px}.t-compact p{margin-bottom:7px}.t-exec header{border-bottom:3px double #111;padding-bottom:10px}.t-exec h1{text-transform:uppercase;letter-spacing:.12em;font-size:1.8em}.t-exec h2{font-variant:small-caps;text-transform:none;letter-spacing:.08em;font-size:1.15em;border-bottom:1px solid #9ca3af}.t-minimal h1{font-weight:300;font-size:2.3em}.t-minimal h2{border:0;letter-spacing:.14em;margin:18px 0 6px}.t-minimal .ct{color:#555}.t-banner header{background:var(--ac);color:#fff;padding:12px 14px;border-radius:2px}.t-banner .ct{color:#e5e7eb}.t-banner h2{color:var(--ac);border-bottom:1px solid var(--ac)}#page a{color:inherit;text-decoration:underline;text-decoration-color:#9ca3af;text-underline-offset:2px}
.top{min-height:56px;display:flex;align-items:center;gap:14px;padding:6px 16px;background:var(--pn);border-bottom:1px solid var(--line)}.top .back{display:inline-block;padding:6px 14px;border:1px solid var(--ui);border-radius:4px;color:var(--ui);background:var(--inp);text-decoration:none;font-weight:600;white-space:nowrap}.top .back:hover{background:var(--ui);color:var(--onui)}.ttl{flex:1;display:flex;flex-direction:column;line-height:1.25}.ttl b{font-size:17px}.tg{font-size:12px;color:var(--mut)}.foot{min-height:32px;display:flex;align-items:center;justify-content:center;padding:4px 16px;background:var(--pn);border-top:1px solid var(--line);color:var(--mut);font-size:11.5px;text-align:center}
.tabs{display:none}@media(max-width:900px){.app{display:block;height:auto}.panel{overflow:visible;border:0}.preview{height:auto}.bar{top:41px}.tabs{display:flex;position:sticky;top:0;z-index:3;background:var(--pn);border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;border-radius:0;padding:10px}.tabs .on{border-bottom:2px solid var(--ui);font-weight:600}body.pvmode .panel{display:none}body:not(.pvmode) .preview{display:none}}@media(max-width:600px){.tg{display:none}.top{flex-wrap:wrap}}
.pt{width:100%;border-collapse:collapse;table-layout:fixed}.pt>thead>tr>td,.pt>tbody>tr>td,.pt>tfoot>tr>td{padding:0;border:0}.pt>thead>tr>td,.pt>tfoot>tr>td{height:0}
@media print{body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.top,.foot,.tabs{display:none!important}.app{display:block;height:auto}.panel{display:none}.preview{padding:0;overflow:visible;height:auto}#page{box-shadow:none;width:auto;min-height:0;padding:0 14mm 0 20mm!important;zoom:1!important}#page.t-compact{padding:0 12mm 0 20mm!important}.pt>thead>tr>td{height:20mm}.pt>tfoot>tr>td{height:14mm}.t-compact .pt>tfoot>tr>td{height:12mm}@page{size:A4;margin:0}header,.letter-meta,.subject,.bodyp,.closing,.enc{break-inside:avoid;page-break-inside:avoid}}
.badge{font-size:12px;color:var(--mut)}.ok{color:#15803d}.warn{color:#b45309}.danger{color:#b91c1c}.quick{display:flex;gap:6px;flex-wrap:wrap}.quick button{font-size:12px}
@media(min-width:901px){.app{grid-template-columns:clamp(400px,36vw,500px) 1fr;height:calc(100vh - 88px);height:calc(100dvh - 88px)}.preview{height:calc(100vh - 88px);height:calc(100dvh - 88px)}}
@media(max-width:900px){.bar{position:static;grid-template-columns:repeat(4,1fr)}.body{max-width:760px;margin:0 auto;padding:12px 14px 60px}.tabs button{min-height:44px;font-size:15px}.preview{padding:8px}}
@media(max-width:600px){.bar{grid-template-columns:1fr 1fr}.body{padding:10px 10px 60px}.in{padding:8px}.grid{grid-template-columns:1fr}.en .grid{grid-template-columns:1fr 1fr}.en .grid .w{grid-column:1/-1}.tools{flex-wrap:wrap}.tools button{flex:1;min-height:38px}.top{gap:8px;padding:6px 10px}.top .back{padding:6px 10px;font-size:13px}.ttl b{font-size:15px}.foot{font-size:11px;padding:6px 10px}input[type=text],input[type=date],input[type=number],input[type=email],input[type=url],select,textarea{font-size:16px}}
@media(pointer:coarse){button,select,input[type=text],input[type=date],input[type=number],input[type=email],input[type=url]{min-height:40px}}
</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('electralab-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script></head>
<body>
<div class="top"><a class="back" href="Docs.html">← Back to DOCBOX</a><div class="ttl"><b>ElectraLab Docs</b><span class="tg">Cover Letter Builder: clean, professional and ready to print on A4</span></div><button id="theme" type="button">Dark mode</button></div>
<div class="tabs"><button class="on" id="tE">Edit</button><button id="tP">Preview</button></div>
<div class="app"><div class="panel"><div class="bar">
<label>Template<select id="tpl"><option value="classic">Classic (centered)</option><option value="modern">Modern (accent color)</option><option value="compact">Compact (dense)</option><option value="exec">Executive (double rule)</option><option value="minimal">Minimal (airy)</option><option value="banner">Banner (colored header)</option></select></label>
<label>Font<select id="font"><option>Arial</option><option>Calibri</option><option>Times New Roman</option><option>Georgia</option></select></label>
<label>Font size<select id="fs"><option>9</option><option>9.5</option><option>10</option><option selected>10.5</option><option>11</option><option>11.5</option><option>12</option></select></label>
<label>Accent color<input type="color" id="ac" value="#1e3a8a"></label>
<div class="full"><button class="pri" id="print">Print / Save as PDF (A4)</button></div>
<div class="full"><button id="ex">Quick-start</button><button id="reset">Reset</button></div><div class="full badge" id="pgs"></div>
</div><div class="body" id="form"></div></div><div class="preview" id="pv"><div id="page"></div></div></div>
<footer class="foot">Free, safe and private: no sign-up, no tracking, no data stored on any server. Everything you type stays in your browser and never leaves your device.</footer>
<script>
const $=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LK=/([\w.+-]+@[\w-]+(?:\.[\w-]+)+)|((?:https?:\/\/|www\.)[^\s<]+|\b(?:[a-z0-9-]+\.)+(?:com|org|net|io|dev|me|co|app|edu|info|bd|uk|us|ca)\b(?:\/[^\s<]*)?)/gi;
const linkify=t=>e(t).replace(LK,(m,em)=>{const x=m.replace(/[.,;:!?)]+$/,''),r=m.slice(x.length),href=em?'mailto:'+x:(/^https?:/i.test(x)?x:'https://'+x);return `<a href="${href}" target="_blank" rel="noopener">${x}</a>${r}`});
const mail=t=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(t||'').trim())?`<a href="mailto:${e(t.trim())}">${e(t.trim())}</a>`:e(t);
const tel=t=>`<a href="tel:${String(t).replace(/[^\d+]/g,'')}">${e(t)}</a>`;
const escLines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
const today=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
const def=()=>({p:{date:today(),salutation:'Dear Hiring Manager,',closing:'Sincerely,'},paras:[],o:{tpl:'classic',font:'Arial',fs:'10.5',ac:'#1e3a8a'}});
let D=def();
function has(v){return Object.values(v||{}).some(x=>x);}
function fld(k,label,v,type='text',wide=false){const input=type==='textarea'?`<textarea data-k="${k}" ${wide?'class="w"':''}>${e(v)}</textarea>`:`<input type="${type}" data-k="${k}" value="${e(v)}">`;return `<label class="f${wide?' w':''}">${label}${input}</label>`}
function form(){
 let h=`<p class=hint style="margin:0 0 10px">Fill in only what you need. Empty fields are omitted from the letter.</p>
 <div class=card><h3>Quick-start examples</h3><div class=in><div class=quick><button data-example="maintenance">Maintenance Engineer</button><button data-example="site">Site Engineer</button><button data-example="design">Design Engineer</button></div><p class=hint>Loads a complete example that you can edit.</p></div></div>
 <div class=card><h3>Sender details</h3><div class=in><div class=grid>${fld('name','Name',D.p.name)}${fld('address','Address',D.p.address,'textarea',true)}${fld('phone','Phone',D.p.phone)}${fld('email','Email',D.p.email,'email')}${fld('web','Website / LinkedIn',D.p.web,'text',true)}</div></div></div>
 <div class=card><h3>Letter details</h3><div class=in><div class=grid>${fld('date','Date',D.p.date,'date')}${fld('salutation','Salutation',D.p.salutation)}${fld('rname','Recipient name',D.p.rname)}${fld('rtitle','Recipient title',D.p.rtitle)}${fld('company','Company',D.p.company)}${fld('raddress','Recipient address',D.p.raddress,'textarea',true)}${fld('subject','Subject line',D.p.subject,'text',true)}</div></div></div>
 <div class=card><h3>Body paragraphs</h3><div class=in>${D.paras.map((x,i)=>`<div class=en><div class=tools><button data-a=up data-i="${i}">↑</button><button data-a=dn data-i="${i}">↓</button><button data-a=del data-i="${i}">Remove</button></div><label class=f>Paragraph ${i+1}<textarea data-para="${i}">${e(x)}</textarea></label></div>`).join('')}<button class=add data-a=add>+ Add paragraph</button><p class=hint>Use one paragraph per box. Move paragraphs with ↑ / ↓.</p></div></div>
 <div class=card><h3>Closing</h3><div class=in><div class=grid>${fld('closing','Closing',D.p.closing)}${fld('signature','Signature name',D.p.signature)}${fld('enclosures','Enclosures',D.p.enclosures,'text',true)}</div></div></div>
 <div class=card><h3>Writing check</h3><div class=in id=check></div></div>`;
 $('form').innerHTML=h;
}
function draw(){
 const P=D.p,pg=$('page');pg.className='t-'+D.o.tpl;pg.style.fontFamily=`"${D.o.font}",${D.o.font==='Calibri'?'Carlito,Arial,':''}${D.o.font==='Times New Roman'||D.o.font==='Georgia'?'serif':'sans-serif'}`;pg.style.fontSize=D.o.fs+'pt';pg.style.setProperty('--ac',D.o.ac);document.documentElement.style.setProperty('--ac',D.o.ac);
 let h=`<header><div class=hd><h1>${e(P.name)||'Cover Letter'}</h1><div class=ct>${[P.email&&mail(P.email),P.phone&&tel(P.phone),P.address&&linkify(P.address).replace(/\n/g,'<br>'),P.web&&linkify(P.web)].filter(Boolean).join(' &nbsp;|&nbsp; ')}</div></div></header>`;
 const rec=[P.rname,P.rtitle,P.company,P.raddress].filter(Boolean).map(linkify).join('<br>');if(P.date||rec)h+=`<div class=letter-meta><div>${rec}</div><div>${e(P.date)}</div></div>`;
 if(P.subject)h+=`<div class=subject>Subject: ${e(P.subject)}</div>`;
 if(P.salutation)h+=`<p>${e(P.salutation)}</p>`;
 D.paras.filter(Boolean).forEach(x=>h+=`<p class=bodyp>${linkify(x).replace(/\n/g,'<br>')}</p>`);
 if(P.closing||P.signature)h+=`<div class=closing>${P.closing?`<div>${e(P.closing)}</div>`:''}${P.signature?`<div class=sig><b>${e(P.signature)}</b></div>`:''}</div>`;
 if(P.enclosures)h+=`<div class=enc><b>Enclosures:</b> ${e(P.enclosures)}</div>`;
 pg.innerHTML=`<table class=pt><thead><tr><td></td></tr></thead><tbody><tr><td>${h}</td></tr></tbody><tfoot><tr><td></td></tr></tfoot></table>`;fit();check();
}
function fit(){const w=$('pv').clientWidth-32;if(w<=0)return;const pg=$('page'),mm=96/25.4;pg.style.zoom=1;const h=pg.offsetHeight;pg.style.zoom=Math.min(1,w/(210*mm));const bot=D.o.tpl==='compact'?12:14,pages=Math.max(1,Math.ceil((h-(20+bot)*mm)/((277-bot)*mm)-.02));$('pgs').innerHTML=pages===1?'<span class=ok>✓ Fits on 1 A4 page</span>':`<span class=warn>${pages} pages. Try a smaller font or Compact template.</span>`}
function check(){const text=[D.p.subject,D.p.salutation,...D.paras,D.p.closing,D.p.enclosures].filter(Boolean).join(' '),words=text.trim()?text.trim().split(/\s+/).length:0;let h=`<div class=badge><b>${words}</b> words</div>`;if(words>650)h+=`<div class=warn style="margin-top:5px">This is getting long for a single A4 page. The page-fit indicator above is the final check.</div>`;if(!D.p.name)h+=`<div class=danger style="margin-top:5px">Tip: add your name.</div>`;if(!D.p.rname&&!D.p.company)h+=`<div class=badge style="margin-top:5px">Tip: add a recipient or company.</div>`;$('check').innerHTML=h}
$('form').addEventListener('input',ev=>{const t=ev.target;if(t.dataset.para!==undefined)D.paras[+t.dataset.para]=t.value;else if(t.dataset.k)D.p[t.dataset.k]=t.value;draw()});
$('form').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.example){const examples={
 maintenance:{name:'Alex Rahman',address:'Dhaka, Bangladesh',phone:'+880 1XXX XXXXXX',email:'alex@example.com',web:'linkedin.com/in/alexrahman',date:today(),rname:'Hiring Manager',rtitle:'HR / Engineering Manager',company:'ABC Industrial Services',raddress:'Dhaka, Bangladesh',subject:'Application for Maintenance Engineer',salutation:'Dear Hiring Manager,',paras:['I am writing to apply for the Maintenance Engineer position at ABC Industrial Services. My background in electrical maintenance, troubleshooting and preventive maintenance has prepared me to support reliable plant operations.','I have experience with LV distribution, motors, control panels, protective devices and maintenance documentation. I am comfortable coordinating with technicians and other engineering teams while keeping safety and planned downtime in focus.','I would welcome the opportunity to discuss how my practical electrical experience can support your maintenance team. Thank you for considering my application.'],closing:'Sincerely,',signature:'Alex Rahman',enclosures:'CV'},site:{name:'Alex Rahman',address:'Dhaka, Bangladesh',phone:'+880 1XXX XXXXXX',email:'alex@example.com',web:'linkedin.com/in/alexrahman',date:today(),rname:'Project Manager',rtitle:'Project Manager',company:'Delta Engineering Ltd.',raddress:'Chattogram, Bangladesh',subject:'Application for Electrical Site Engineer',salutation:'Dear Project Manager,',paras:['I am applying for the Electrical Site Engineer position with Delta Engineering Ltd. I bring hands-on experience supporting electrical installation, testing, commissioning and site coordination.','My experience includes reviewing drawings, coordinating installation activities, checking materials, supporting inspection and testing, and maintaining clear site records. I work carefully with contractors and project teams to keep electrical work safe and aligned with drawings and specifications.','I would be pleased to discuss my experience and availability for your current projects. Thank you for your time and consideration.'],closing:'Kind regards,',signature:'Alex Rahman',enclosures:'CV'},design:{name:'Alex Rahman',address:'Dhaka, Bangladesh',phone:'+880 1XXX XXXXXX',email:'alex@example.com',web:'linkedin.com/in/alexrahman',date:today(),rname:'Engineering Manager',rtitle:'Engineering Manager',company:'Power Design Associates',raddress:'Dhaka, Bangladesh',subject:'Application for Electrical Design Engineer',salutation:'Dear Engineering Manager,',paras:['I am writing to express my interest in the Electrical Design Engineer position at Power Design Associates. My engineering background includes electrical system design, technical documentation and coordination with multidisciplinary project teams.','I have worked with single-line diagrams, load schedules, cable selection, protection concepts, equipment schedules and drawing revisions. I value clear documentation, practical designs and close coordination between design and site requirements.','I would appreciate the opportunity to discuss how my skills could contribute to your design team. Thank you for reviewing my application.'],closing:'Sincerely,',signature:'Alex Rahman',enclosures:'CV'}};D.p={...D.p,...examples[b.dataset.example]};D.paras=[...examples[b.dataset.example].paras];form();draw();return}
 const a=b.dataset.a,i=+b.dataset.i;if(a==='add')D.paras.push('');else if(a==='del')D.paras.splice(i,1);else if(a==='up'&&i>0)[D.paras[i-1],D.paras[i]]=[D.paras[i],D.paras[i-1]];else if(a==='dn'&&i<D.paras.length-1)[D.paras[i+1],D.paras[i]]=[D.paras[i],D.paras[i+1]];form();draw();});
[['tpl','tpl'],['font','font'],['fs','fs'],['ac','ac']].forEach(([id,k])=>{$(id).value=D.o[k];$(id).addEventListener('input',()=>{D.o[k]=$(id).value;draw()})});
$('print').onclick=()=>{const t=document.title,was=document.body.classList.contains('pvmode');document.body.classList.add('pvmode');document.title=(D.p.name||'Cover Letter')+' - Cover Letter';addEventListener('afterprint',()=>{document.title=t;document.body.classList.toggle('pvmode',was)},{once:true});window.print()};
$('reset').onclick=()=>{if(confirm('Clear all entries and start over?')){D=def();refresh()}};
const examplesLink=()=>{};function refresh(){['tpl','font','fs','ac'].forEach(k=>$(k).value=D.o[k]);form();draw()}
const tab=p=>{document.body.classList.toggle('pvmode',p);$('tE').className=p?'':'on';$('tP').className=p?'on':'';fit();scrollTo(0,0)};$('tE').onclick=()=>tab(false);$('tP').onclick=()=>tab(true);
const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('electralab-theme',t)}catch(_){}$('theme').textContent=t==='dark'?'Light mode':'Dark mode'};$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(document.documentElement.dataset.theme||'light');addEventListener('resize',fit);refresh();
</script></body></html>
